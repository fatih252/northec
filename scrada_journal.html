<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scrada Dagontvangsten</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4361ee;
            --primary-hover: #3651d4;
            --bg-light: #f4f6f9;
            --touch-height: 48px;
        }

        body { 
            background-color: var(--bg-light); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 12px;
            user-select: none;
            -webkit-user-select: none;
        }

        .touch-btn {
            min-height: var(--touch-height);
            font-size: 0.95rem;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }

        .touch-input {
            min-height: var(--touch-height);
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            color: var(--primary);
        }

        .card { 
            border: none; 
            border-radius: 10px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); 
            background: #fff;
            margin-bottom: 12px;
        }

        /* KPI Banner */
        .kpi-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 12px;
        }
        .kpi-box {
            background: #fff;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        .kpi-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 700;
            color: #64748b;
        }
        .kpi-amount {
            font-size: 1.4rem;
            font-weight: 800;
            color: #1e293b;
        }

        /* Table Design */
        .table-wrapper {
            max-height: calc(100vh - 270px);
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #fff;
        }

        .table thead th {
            position: sticky;
            top: 0;
            background-color: #1e293b;
            color: #fff;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 14px 16px;
            z-index: 2;
            white-space: nowrap;
        }

        .table tbody tr.day-row {
            cursor: pointer;
            transition: background 0.15s;
        }

        .table tbody tr.day-row:hover {
            background-color: #f8fafc;
        }

        .table tbody td {
            vertical-align: middle;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 14px 16px;
            color: #1e293b;
        }

        .table tfoot td {
            position: sticky;
            bottom: 0;
            background-color: #f1f5f9;
            border-top: 2px solid #1e293b;
            font-size: 1.05rem;
            font-weight: 800;
            padding: 14px 16px;
            z-index: 2;
        }

        /* Badges */
        .status-badge {
            font-size: 0.85rem;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            white-space: nowrap;
        }
        .balanced { background-color: #dcfce7; color: #166534; }
        .unbalanced { background-color: #fee2e2; color: #991b1b; }

        /* Detail Accordion Panel */
        .detail-row td {
            background-color: #f8fafc !important;
            padding: 16px 20px !important;
        }

        .detail-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 14px 18px;
        }

        .spinner-overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(255,255,255,0.85); 
            display: none; 
            justify-content: center; 
            align-items: center; 
            z-index: 9999; 
        }

        .quick-btn {
            min-height: 40px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 6px;
        }

        .unsent-alert-box {
            background: #fffbeb;
            border: 1px solid #fef3c7;
            border-left: 5px solid #f59e0b;
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 12px;
            color: #92400e;
        }
    </style>
</head>
<body>
    <div class="spinner-overlay" id="loadingSpinner">
        <div class="spinner-border text-primary" role="status" style="width: 3.5rem; height: 3.5rem;"></div>
    </div>

    <div class="container-fluid px-1">
        <!-- Toolbar -->
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-2 gap-2">
            <div>
                <h4 class="mb-0 text-dark fw-bold">
                    <i class="fa-solid fa-book-journal-whills text-primary me-2"></i> Scrada Dagontvangsten
                </h4>
            </div>

            <div class="d-flex flex-wrap gap-2">
                <button id="btnRefresh" class="btn btn-outline-secondary touch-btn">
                    <i class="fa-solid fa-rotate-right me-1"></i> Vernieuwen
                </button>
                <button id="btnClose" class="btn btn-danger touch-btn">
                    <i class="fa-solid fa-xmark me-1"></i> Sluiten
                </button>
            </div>
        </div>

        <!-- On-Screen Alert voor niet-verzonden data -->
        <div id="unsentAlertBox" class="unsent-alert-box d-none">
            <div class="d-flex align-items-center">
                <i class="fa-solid fa-triangle-exclamation fa-2x me-3 text-warning"></i>
                <div class="flex-grow-1">
                    <h6 class="fw-bold mb-1">Niet-verzonden Dagontvangsten</h6>
                    <div id="unsentAlertMessage" class="fw-semibold"></div>
                </div>
            </div>
        </div>

        <!-- Filter Bar (Standaard Vandaag) -->
        <div class="card p-2">
            <div class="row g-2 align-items-center">
                <div class="col-lg-4 col-md-6 col-12">
                    <div class="input-group">
                        <span class="input-group-text bg-light fw-bold">Van</span>
                        <input type="date" id="fromDate" class="form-control touch-input">
                        <span class="input-group-text bg-light fw-bold">Tot</span>
                        <input type="date" id="tillDate" class="form-control touch-input">
                    </div>
                </div>
                <div class="col-lg-8 col-md-6 col-12 d-flex gap-1 flex-wrap justify-content-md-end">
                    <button class="btn btn-primary quick-btn px-3" onclick="setQuickDate('today')">Vandaag</button>
                    <button class="btn btn-outline-primary quick-btn px-2" onclick="setQuickDate('yesterday')">Gisteren</button>
                    <button class="btn btn-outline-primary quick-btn px-2" onclick="setQuickDate('last7')">7 Dagen</button>
                    <button class="btn btn-outline-primary quick-btn px-2" onclick="setQuickDate('last30')">30 Dagen</button>
                    <button class="btn btn-outline-primary quick-btn px-2" onclick="setQuickDate('thisMonth')">Deze Maand</button>
                </div>
            </div>
        </div>

        <div id="alertContainer"></div>

        <!-- KPI Summary Cards -->
        <div class="kpi-container" id="kpiBar">
            <div class="kpi-box border-start border-4 border-primary">
                <div class="kpi-title">Kassa Omzet (Z-Rapport)</div>
                <div class="kpi-amount text-primary" id="kpiKassa">€ 0.00</div>
            </div>
            <div class="kpi-box border-start border-4 border-info">
                <div class="kpi-title">Geboekt in Scrada</div>
                <div class="kpi-amount text-dark" id="kpiScrada">€ 0.00</div>
            </div>
            <div class="kpi-box border-start border-4 border-warning">
                <div class="kpi-title">Verschil</div>
                <div class="kpi-amount" id="kpiDiff">€ 0.00</div>
            </div>
            <div class="kpi-box d-flex align-items-center justify-content-between">
                <div>
                    <div class="kpi-title">Status Periode</div>
                    <div id="kpiStatusBadge" class="status-badge balanced mt-1">-</div>
                </div>
                <i class="fa-solid fa-scale-balanced fa-2x text-muted opacity-25"></i>
            </div>
        </div>

        <!-- 1 Regel Per Dag Tabel -->
        <div class="table-wrapper">
            <table class="table table-hover mb-0" id="mainTable">
                <thead>
                    <tr>
                        <th>Datum</th>
                        <th class="text-end">Kassa Omzet</th>
                        <th class="text-end">Scrada Omzet</th>
                        <th class="text-end">Verschil</th>
                        <th class="text-center">Status</th>
                        <th class="text-center" style="width: 140px;">Actie</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="6" class="text-center py-4 text-muted">Laden...</td></tr>
                </tbody>
                <tfoot id="tableFoot" class="d-none">
                    <tr>
                        <td>TOTAAL</td>
                        <td class="text-end text-primary" id="footKassa">€ 0.00</td>
                        <td class="text-end text-dark" id="footScrada">€ 0.00</td>
                        <td class="text-end" id="footDiff">€ 0.00</td>
                        <td class="text-center" id="footStatus">-</td>
                        <td></td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>

    <script>
        const fromDateInput = document.getElementById('fromDate');
        const tillDateInput = document.getElementById('tillDate');
        const btnRefresh = document.getElementById('btnRefresh');
        const btnClose = document.getElementById('btnClose');
        const spinner = document.getElementById('loadingSpinner');
        const tableBody = document.getElementById('tableBody');
        const tableFoot = document.getElementById('tableFoot');
        const alertContainer = document.getElementById('alertContainer');
        const unsentAlertBox = document.getElementById('unsentAlertBox');
        const unsentAlertMessage = document.getElementById('unsentAlertMessage');

        // Standaard VANDAAG (met nachthoreca-afhandeling vóór 05:00)
        function initDefaultDates() {
            const now = new Date();
            if (now.getHours() < 5) now.setDate(now.getDate() - 1);
            
            const todayStr = now.toISOString().split('T')[0];
            fromDateInput.value = todayStr;
            tillDateInput.value = todayStr;
        }

        initDefaultDates();

        function setQuickDate(type) {
            const now = new Date();
            if (now.getHours() < 5) now.setDate(now.getDate() - 1);

            let from = new Date(now);
            let till = new Date(now);

            if (type === 'today') {
                // vandaags
            } else if (type === 'yesterday') {
                from.setDate(from.getDate() - 1);
                till.setDate(till.getDate() - 1);
            } else if (type === 'last7') {
                from.setDate(from.getDate() - 6);
            } else if (type === 'last30') {
                from.setDate(from.getDate() - 29);
            } else if (type === 'thisMonth') {
                from.setDate(1);
            }

            fromDateInput.value = from.toISOString().split('T')[0];
            tillDateInput.value = till.toISOString().split('T')[0];
            loadData();
        }

        function loadData() {
            if (fromDateInput.value > tillDateInput.value) {
                alert("Startdatum mag niet later zijn dan einddatum.");
                return;
            }

            spinner.style.display = 'flex';
            alertContainer.innerHTML = '';
            
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage({ 
                    action: 'load_journal_data', 
                    fromDate: fromDateInput.value,
                    tillDate: tillDateInput.value
                });
            }
        }

        fromDateInput.addEventListener('change', loadData);
        tillDateInput.addEventListener('change', loadData);
        btnRefresh.addEventListener('click', loadData);

        btnClose.addEventListener('click', function() {
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage({ action: 'close' });
            }
        });

        function sendDay(dateStr) {
            event.stopPropagation();
            if (confirm(`Wilt u de dagontvangsten van ${dateStr.split('-').reverse().join('-')} nu doorsturen naar Scrada?`)) {
                spinner.style.display = 'flex';
                if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage({ 
                        action: 'send_daily_receipt_single', 
                        date: dateStr,
                        fromDate: fromDateInput.value,
                        tillDate: tillDateInput.value
                    });
                }
            }
        }

        function toggleDetail(idx) {
            const el = document.getElementById(`detail_${idx}`);
            if (el) el.classList.toggle('d-none');
        }

        window.renderJournalData = function(response) {
            spinner.style.display = 'none';

            // Waarschuwingsbanner voor niet-verzonden dagen (vandaag/gisteren)
            if (response.alert && response.alert.hasAlert) {
                unsentAlertBox.classList.remove('d-none');
                unsentAlertMessage.innerText = response.alert.message;
            } else {
                unsentAlertBox.classList.add('d-none');
            }

            if (response.successMessage) {
                alertContainer.innerHTML = `
                    <div class="alert alert-success alert-dismissible fade show shadow-sm py-2">
                        <i class="fa-solid fa-circle-check me-2"></i> ${response.successMessage}
                        <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
                    </div>`;
            }

            if (!response.success) {
                tableBody.innerHTML = `<tr><td colspan="6" class="text-center text-danger py-4">${response.errorMessage}</td></tr>`;
                tableFoot.classList.add('d-none');
                return;
            }

            const data = response.data;
            if (!data || !data.days || data.days.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4"><i class="fa-solid fa-folder-open me-2"></i> Geen gegevens gevonden voor deze periode.</td></tr>`;
                tableFoot.classList.add('d-none');
                return;
            }

            // Update KPI Banner
            document.getElementById('kpiKassa').innerText = `€ ${data.grandKassaOmzet.toFixed(2)}`;
            document.getElementById('kpiScrada').innerText = `€ ${data.grandScradaOmzet.toFixed(2)}`;
            
            const diffEl = document.getElementById('kpiDiff');
            diffEl.innerText = `€ ${data.grandDiff.toFixed(2)}`;
            diffEl.className = data.isGrandBalanced ? 'kpi-amount text-success' : 'kpi-amount text-danger';

            const badgeEl = document.getElementById('kpiStatusBadge');
            badgeEl.className = data.isGrandBalanced ? 'status-badge balanced' : 'status-badge unbalanced';
            badgeEl.innerHTML = data.isGrandBalanced 
                ? `<i class="fa-solid fa-check me-1"></i> In Evenwicht`
                : `<i class="fa-solid fa-triangle-exclamation me-1"></i> Verschil`;

            // Render Table Rows
            let html = '';

            data.days.forEach((day, idx) => {
                const statusBadge = day.isBalanced
                    ? `<span class="status-badge balanced"><i class="fa-solid fa-check me-1"></i> Klopt</span>`
                    : `<span class="status-badge unbalanced"><i class="fa-solid fa-triangle-exclamation me-1"></i> Verschil</span>`;

                let actionHtml = '';
                if (day.isSent) {
                    actionHtml = `<span class="text-success small fw-bold"><i class="fa-solid fa-circle-check me-1"></i> Verzonden</span>`;
                } else if (day.canSend) {
                    actionHtml = `
                        <button class="btn btn-sm btn-primary touch-btn py-1 px-3" onclick="sendDay('${day.date}')">
                            <i class="fa-solid fa-paper-plane me-1"></i> Stuur
                        </button>`;
                } else {
                    actionHtml = `<span class="text-muted small">&mdash;</span>`;
                }

                // Detail BTW regels (Kassa uitsplitsing)
                let kassaVatHtml = '';
                if (day.kassaVatBreakdown && day.kassaVatBreakdown.length > 0) {
                    kassaVatHtml = day.kassaVatBreakdown.map(v => `
                        <tr>
                            <td><strong>${v.vatPerc}%</strong></td>
                            <td class="text-end">€ ${v.netAmount.toFixed(2)}</td>
                            <td class="text-end">€ ${v.vatAmount.toFixed(2)}</td>
                            <td class="text-end fw-bold">€ ${v.grossAmount.toFixed(2)}</td>
                        </tr>`).join('');
                } else {
                    kassaVatHtml = `<tr><td colspan="4" class="text-muted text-center py-2">Geen Kassa BTW data</td></tr>`;
                }

                // Detail Betalingen
                let payDetailHtml = '';
                if (day.paymentLines && day.paymentLines.length > 0) {
                    payDetailHtml = day.paymentLines.map(p => `
                        <div class="d-flex justify-content-between py-1 border-bottom">
                            <span>${p.paymentMethodName}</span>
                            <strong>€ ${p.amount.toFixed(2)}</strong>
                        </div>`).join('');
                } else {
                    payDetailHtml = `<div class="text-muted small py-1">Geen betalingen</div>`;
                }

                html += `
                    <tr class="day-row" onclick="toggleDetail(${idx})">
                        <td><strong>${day.formattedDate}</strong> <i class="fa-solid fa-chevron-down ms-1 text-muted small"></i></td>
                        <td class="text-end text-primary fw-bold">€ ${day.kassaOmzet.toFixed(2)}</td>
                        <td class="text-end text-dark fw-bold">€ ${day.scradaOmzet.toFixed(2)}</td>
                        <td class="text-end ${day.isBalanced ? 'text-success' : 'text-danger fw-bold'}">
                            € ${day.diff.toFixed(2)}
                        </td>
                        <td class="text-center">${statusBadge}</td>
                        <td class="text-center">${actionHtml}</td>
                    </tr>
                    <!-- Detail Paneel -->
                    <tr id="detail_${idx}" class="d-none detail-row">
                        <td colspan="6">
                            <div class="row g-3">
                                <div class="col-md-7 col-12">
                                    <div class="detail-card">
                                        <div class="fw-bold text-secondary mb-2 small text-uppercase">
                                            <i class="fa-solid fa-chart-pie me-1"></i> Kassa BTW Specificatie (Z-Rapport)
                                        </div>
                                        <table class="table table-sm table-borderless mb-0">
                                            <thead>
                                                <tr class="text-muted border-bottom small">
                                                    <th>Tarief</th>
                                                    <th class="text-end">Excl. BTW</th>
                                                    <th class="text-end">BTW-bedrag</th>
                                                    <th class="text-end">Totaal Incl.</th>
                                                </tr>
                                            </thead>
                                            <tbody>${kassaVatHtml}</tbody>
                                        </table>
                                    </div>
                                </div>
                                <div class="col-md-5 col-12">
                                    <div class="detail-card">
                                        <div class="fw-bold text-secondary mb-2 small text-uppercase">
                                            <i class="fa-solid fa-credit-card me-1"></i> Ontvangen Bedragen
                                        </div>
                                        ${payDetailHtml}
                                    </div>
                                </div>
                            </div>
                        </td>
                    </tr>`;
            });

            tableBody.innerHTML = html;

            // Render Footer
            tableFoot.classList.remove('d-none');
            document.getElementById('footKassa').innerText = `€ ${data.grandKassaOmzet.toFixed(2)}`;
            document.getElementById('footScrada').innerText = `€ ${data.grandScradaOmzet.toFixed(2)}`;
            
            const footDiff = document.getElementById('footDiff');
            footDiff.innerText = `€ ${data.grandDiff.toFixed(2)}`;
            footDiff.className = data.isGrandBalanced ? 'text-end text-success' : 'text-end text-danger fw-bold';

            document.getElementById('footStatus').innerHTML = data.isGrandBalanced
                ? `<span class="status-badge balanced"><i class="fa-solid fa-check me-1"></i> Klopt</span>`
                : `<span class="status-badge unbalanced"><i class="fa-solid fa-triangle-exclamation me-1"></i> Verschil</span>`;
        };

        window.onload = () => { setTimeout(loadData, 300); };
    </script>
</body>
</html>
