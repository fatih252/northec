<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset='utf-8' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js'></script>
    <style>
        html, body { 
            margin: 0; padding: 0; height: 100%; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            overflow: hidden; background-color: white;
        }
        #calendar { height: 100vh; padding: 10px; box-sizing: border-box; }

        /* PizzaApp Branding voor de knoppen */
        .fc-button-primary {
            background-color: #630303 !important;
            border-color: #630303 !important;
        }
        .fc-button-primary:disabled {
            background-color: #8c4a4a !important;
        }

        .fc-event { 
            background-color: #630303 !important; 
            border: none !important; 
            cursor: pointer; 
            padding: 2px;
        }

        @keyframes blinker { 50% { opacity: 0.3; } }
        .blink-event {
            animation: blinker 1s linear infinite;
            background-color: #ff0000 !important;
            border: 2px solid yellow !important;
        }
    </style>
</head>
<body>
    <div id='calendar'></div>
    <script>
        let calendar;

        document.addEventListener('contextmenu', event => event.preventDefault());

        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');
            
            calendar = new FullCalendar.Calendar(calendarEl, {
                // Toon navigatie en weergave-opties
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                initialView: 'timeGridWeek', // Begin nu met een maandoverzicht
                locale: 'nl',
                slotLabelFormat: { hour: '2-digit', minute: '2-digit', hour12: false },
                eventTimeFormat: { hour: '2-digit', minute: '2-digit', hour12: false },
                slotMinTime: '08:00:00',
                slotMaxTime: '22:00:00',
                allDaySlot: false,
                height: '100%',
                nowIndicator: true,

                // Event afgevuurd wanneer de gebruiker navigeert (volgende maand/week)
                datesSet: function(info) {
                    const range = {
                        action: 'fetchData',
                        start: info.startStr,
                        end: info.endStr
                    };
                    if (window.chrome && window.chrome.webview) {
                        window.chrome.webview.postMessage(range);
                    }
                },

                eventClassNames: function(arg) {
                    if (arg.event.extendedProps.processed == 0 || arg.event.extendedProps.processed === false) {
                        return [ 'blink-event' ];
                    }
                    return [];
                },

                eventClick: function(info) {
                    const orderData = {
                        action: 'openOrder',
                        title: info.event.title,
                        order_id: info.event.id || info.event.extendedProps.order_id,
                        processed: info.event.extendedProps.processed
                    };
                    if (window.chrome && window.chrome.webview) {
                        window.chrome.webview.postMessage(orderData);
                    }
                },
                events: []
            });
            calendar.render();
        });

        function updateEvents(jsonData) {
            if (calendar) {
                calendar.removeAllEvents();
                calendar.addEventSource(jsonData);
            }
        }
    </script>
</body>
</html>
