<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #calendar { height: 100vh; }
        /* Kleur van de foodtruck-branding */
        .fc-event { background-color: #630303; border: none; cursor: pointer; }
		
		
		html, body { 
    height: 100%; 
    margin: 0; 
    padding: 0; 
    overflow: hidden; 
}
#calendar { 
    height: 100vh; 
}
    </style>
</head>
<body>
    <div id='calendar'></div>
    <script>
        let calendar;
        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'timeGridWeek', // Weekoverzicht met tijden
                locale: 'nl',               // Nederlands!
                firstDay: 1,                // Start op maandag
                slotLabelFormat: { hour: '2-digit', minute: '2-digit', hour12: false }, // 24H
                eventTimeFormat: { hour: '2-digit', minute: '2-digit', hour12: false }, // 24H in events
                slotMinTime: '08:00:00',    // Startuur
                slotMaxTime: '21:00:00',    // Einduur
                allDaySlot: false,
                height: 'auto',
                events: []                  // Wordt gevuld vanuit C#
            });
            calendar.render();
        });

        // Functie die we vanuit C# aanroepen
        function updateEvents(jsonData) {
            calendar.removeAllEvents();
            calendar.addEventSource(jsonData);
        }
    </script>
</body>
</html>
