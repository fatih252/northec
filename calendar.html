<!DOCTYPE html>
<html lang='nl'>
<head>
    <meta charset='utf-8' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js'></script>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #fff; }
        #calendar { height: 100vh; }
        /* Styling voor de adres-blokken */
        .fc-event-title { font-weight: bold; font-size: 0.9em; }
        .fc-event { background-color: #630303; border: none; padding: 2px; }
    </style>
</head>
<body>
    <div id='calendar'></div>
    <script>
        var calendar;

        // Blokkeer rechtermuisklik
        document.addEventListener('contextmenu', event => event.preventDefault());

        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                // Maak een weergave van precies 7 dagen vanaf 'nu'
                views: {
                    timeGridSevenDay: {
                        type: 'timeGrid',
                        duration: { days: 7 }
                    }
                },
                initialView: 'timeGridSevenDay',
                locale: 'nl',
                firstDay: new Date().getDay(), // Begint bij vandaag
                slotLabelFormat: { hour: '2-digit', minute: '2-digit', hour12: false },
                eventTimeFormat: { hour: '2-digit', minute: '2-digit', hour12: false },
                slotMinTime: '08:00:00',
                slotMaxTime: '22:00:00',
                allDaySlot: false,
                nowIndicator: true, // Toont een rode lijn op de huidige tijd
                height: '100%',
                events: []
            });
            calendar.render();
        });

        function updateEvents(jsonData) {
            if (calendar) {
                calendar.removeAllEvents();
                calendar.addEventSource(jsonData);
            }
        }
    </script>
</body>
</html>
