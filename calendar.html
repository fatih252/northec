<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset='utf-8' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js'></script>
    <style>
        html, body { 
            margin: 0; padding: 0; height: 100%; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            overflow: hidden; background-color: white;
        }
        #calendar { height: 100vh; }

        /* Standaard styling voor events */
        .fc-event { 
            background-color: #630303 !important; 
            border: none !important; 
            cursor: pointer; 
            padding: 2px;
        }

        /* --- NIEUW: KNIPPER EFFECT --- */
        @keyframes blinker {
            50% { opacity: 0.3; }
        }

        .blink-event {
            animation: blinker 1s linear infinite;
            background-color: #ff0000 !important; /* Felrood voor onbevestigde orders */
            border: 2px solid yellow !important;   /* Extra opvallend */
        }

        .fc-event:hover { background-color: #800000 !important; opacity: 1 !important; }
    </style>
</head>
<body>
    <div id='calendar'></div>
    <script>
        let calendar;

        document.addEventListener('contextmenu', event => event.preventDefault());

        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');
            
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'timeGrid',
                duration: { days: 7 }, 
                locale: 'nl',
                slotLabelFormat: { hour: '2-digit', minute: '2-digit', hour12: false },
                eventTimeFormat: { hour: '2-digit', minute: '2-digit', hour12: false },
                slotMinTime: '08:00:00',
                slotMaxTime: '18:00:00',
                allDaySlot: false,
                height: '100%',
                nowIndicator: true,

                eventClassNames: function(arg) {
                    if (arg.event.extendedProps.processed == 0 || arg.event.extendedProps.processed === false) {
                        return [ 'blink-event' ];
                    }
                    return [];
                },

                eventClick: function(info) {
                    const orderData = {
                        title: info.event.title,
                        description: info.event.extendedProps.description,
                        order_id: info.event.id || info.event.extendedProps.order_id,
                        processed: info.event.extendedProps.processed
                    };
                    if (window.chrome && window.chrome.webview) {
                        window.chrome.webview.postMessage(orderData);
                    }
                },
                events: []
            });
            calendar.render();
        });

        function updateEvents(jsonData) {
            if (calendar) {
                calendar.removeAllEvents();
                calendar.addEventSource(jsonData);
            }
        }
    </script>
</body>
</html>
