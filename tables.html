<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POS Touchscreen Floorplan Matrix</title>
    <style>
        :root {
            --pizza-red: #973030;
            --pizza-green: #2e7d32;
            --new-order-bg: #4d805e; 
            --pizza-blue: #b3daff;
            --bg-gray: #e2e8f0; 
            --card-white: #ffffff;
            
            --bg-main: #0b0f19;
            --bg-canvas: #111827;
            --bg-card: #1f2937;
            --border-color: #374151;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            
            /* REVERSED POS COLOR LOGIC */
            --color-vacant: #ef4444; /* Available / Free Table = RED */
            --color-active: #10b981; /* Occupied / Open Order Table = GREEN */
            --color-edit: #3b82f6;
        }

        /* --- DASHBOARD SYSTEM BASE --- */
        * { 
            -webkit-tap-highlight-color: transparent; 
            box-sizing: border-box; 
            user-select: none; 
            -webkit-user-select: none;
            margin: 0; 
            padding: 0; 
            touch-action: none;
        }

        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            font-family: 'Segoe UI', -apple-system, Tahoma, sans-serif;
            background-color: var(--bg-main); 
            color: var(--text-main); 
            overscroll-behavior: none;
        }
        
        #app-container { display: flex; flex-direction: column; width: 100%; height: 100%; }

        /* --- Low-Res Adaptive Touch Control Bar --- */
        #control-bar {
            min-height: 72px;
            background-color: var(--bg-main);
            border-bottom: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            z-index: 9999;
            flex-wrap: wrap; 
            gap: 8px;
        }

        .btn-group { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

        /* Larger POS Touch Buttons */
        .pos-btn {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 2px solid var(--border-color);
            height: 54px; 
            padding: 0 18px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.1s ease, transform 0.05s ease;
        }
        .pos-btn:active { transform: scale(0.96); background-color: #374151; }
        .pos-btn.primary { background-color: var(--pizza-red); border-color: var(--pizza-red); }
        .pos-btn.success { background-color: var(--pizza-green); border-color: var(--pizza-green); }
        .pos-btn.danger { background-color: #b91c1c; border-color: #ef4444; }
        .pos-btn.scale-btn { width: 54px; padding: 0; justify-content: center; font-size: 26px; }

        /* --- Master Workspace Shell --- */
        #workspace {
            display: flex;
            flex: 1;
            width: 100%;
            height: calc(100% - 72px);
            overflow: hidden;
            position: relative;
        }

        #canvas-wrapper { 
            width: 100%;
            height: 100%;
            background-color: var(--bg-canvas);
            overflow: hidden;
            position: relative;
        }
        
        #canvas { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            background-size: cover; 
            background-position: center; 
            overflow: hidden;
        }

        .edit-mode #canvas {
            background-image: 
                linear-gradient(to right, rgba(55, 65, 81, 0.6) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(55, 65, 81, 0.6) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* --- Overlay Sidebar Slider (Wider Order List View) --- */
        #order-sidebar {
            position: absolute;
            right: 0;
            top: 0;
            width: 500px; /* Increased from 420px */
            height: 100%;
            background-color: #f1f5f9;
            border-left: 3px solid #cbd5e1;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 9500; 
            box-shadow: -5px 0 20px rgba(0,0,0,0.3);
        }

        #order-sidebar.collapsed {
            transform: translateX(100%);
        }

        .sidebar-header {
            padding: 14px 16px;
            background-color: #ffffff;
            border-bottom: 2px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #0f172a;
            flex-shrink: 0;
        }
        .sidebar-header h2 { font-size: 18px; font-weight: 800; }

        .order-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sidebar-section-title {
            font-size: 13px;
            font-weight: 800;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #cbd5e1;
            padding: 8px 6px;
            background: #e2e8f0;
            border-radius: 6px;
        }
        .sidebar-section-title.collapsable {
            cursor: pointer;
        }
        .sidebar-section-title.collapsable:active {
            background-color: #cbd5e1;
        }

        .toggle-icon {
            font-size: 12px;
            transition: transform 0.15s ease;
            display: inline-block;
        }
        .collapsed-section .toggle-icon {
            transform: rotate(-90deg);
        }

        .sidebar-section-badge {
            background: #334155;
            color: #ffffff;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 900;
            margin-right: 6px;
        }

        .vertical-stack-bucket {
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: max-height 0.2s ease-out, opacity 0.15s ease;
            overflow: hidden;
            max-height: 2000px; 
            opacity: 1;
        }
        .collapsed-section .vertical-stack-bucket {
            max-height: 0px !important;
            opacity: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        .order-card {
            background: var(--card-white);
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            border: 1px solid #cbd5e1;
            border-left: 12px solid transparent;
            cursor: pointer;
            width: 100%;
        }

        .indicator-table-open { border-left-color: var(--pizza-green) !important; }
        .indicator-table-closed { border-left-color: #ff9800 !important; }

        .address-info { flex-grow: 1; min-width: 0; }
        .address-title { font-weight: 800; font-size: 1.15rem; color: #000000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .order-details { font-size: 0.90rem; color: #334155; margin-top: 3px; line-height: 1.3; text-align: left; }
        .time-tag { font-weight: bold; color: #b91c1c; }
        .price-tag { text-align: right; font-weight: 900; color: var(--pizza-red); font-size: 1.35rem; min-width: 80px; }

        .table-item {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            padding: 8px;
            cursor: pointer;
        }
        
        .table-illustration {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .table-item.vacant .table-illustration .table-top { fill: #450a0a; stroke: var(--color-vacant); stroke-width: 3; }
        .table-item.vacant .table-illustration .chair { fill: #7f1d1d; stroke: var(--color-vacant); stroke-width: 1.5; }
        .table-item.active .table-illustration .table-top { fill: #064e3b; stroke: var(--color-active); stroke-width: 3; }
        .table-item.active .table-illustration .chair { fill: #134e4a; stroke: var(--color-active); stroke-width: 1.5; }

        .table-details {
            position: relative;
            z-index: 2;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 1px;
            pointer-events: none;
        }

        .table-name { font-size: 14px; font-weight: 700; color: var(--text-main); text-shadow: 0 2px 4px rgba(0,0,0,0.6); }
        .table-timer { font-size: 11px; color: #f97316; font-weight: 800; background: rgba(0, 0, 0, 0.7); padding: 1px 5px; border-radius: 5px; width: fit-content; margin: 0 auto; }
        .table-price { font-size: 12px; font-weight: 700; color: #f8fafc; background: var(--pizza-green); padding: 1px 6px; border-radius: 20px; margin-top: 2px; box-shadow: 0 3px 5px rgba(0,0,0,0.3); }

        @media (max-width: 1024px) {
            #order-sidebar { width: 420px; }
            .pos-btn { height: 48px; padding: 0 14px; font-size: 14px; }
            .pos-btn.scale-btn { width: 48px; font-size: 22px; }
            #control-bar { min-height: 65px; padding: 6px; }
            .table-name { font-size: 13px; }
        }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="control-bar">
            <div class="btn-group">
                <button id="btn-edit-toggle" class="pos-btn primary" onclick="toggleEditMode()">
                    <span>Wijzig tafel locaties</span>
                </button>
                <button id="btn-scale-up" class="pos-btn scale-btn" onclick="adjustTableSizes(10)" style="display:none">+</button>
                <button id="btn-scale-down" class="pos-btn scale-btn" onclick="adjustTableSizes(-10)" style="display:none">-</button>
            </div>

            <div class="btn-group">
                <button class="pos-btn" onclick="toggleSidebar()" style="border-color: #64748b;">Bestellingen Lijst</button>
                <button class="pos-btn" onclick="sendToWinForms({action: 'triggerBackgroundPicker'})">Achtergrond Laden</button>
                <button class="pos-btn" onclick="sendToWinForms({action: 'removeBackground'})" style="color: var(--text-muted)">Wissen</button>
                <button class="pos-btn danger" onclick="sendToWinForms({action: 'resetLayout'})">Reset Layout</button>
                <button id="btn-fullscreen" class="pos-btn" onclick="sendToWinForms({action: 'toggleFullscreen'})">Volledig Scherm</button>
                <button class="pos-btn" style="background-color: #4b5563;" onclick="sendToWinForms({action: 'closeForm'})">Sluiten</button>
            </div>
        </div>

        <div id="workspace">
            <div id="canvas-wrapper">
                <div id="canvas"></div>
            </div>

            <div id="order-sidebar" class="collapsed">
                <div class="sidebar-header">
                    <h2>Tafelbeheer Overzicht</h2>
                    <button class="pos-btn scale-btn" style="height: 40px; width: 40px; font-size: 16px; background: #e2e8f0; color: #000; border: none;" onclick="toggleSidebar()">✕</button>
                </div>
                
                <div class="order-list-container">
                    <div class="sidebar-section-title">
                        <span>Actieve Tafels</span>
                        <div>
                            <span id="badgeActiveCount" class="sidebar-section-badge">0</span>
                        </div>
                    </div>
                    <div id="active-bucket" class="vertical-stack-bucket"></div>

                    <div id="history-section-wrapper" class="history-container">
                        <div class="sidebar-section-title collapsable" onclick="toggleHistorySection()" style="margin-top: 10px;">
                            <span>Historiek (Vandaag)</span>
                            <div>
                                <span id="badgeInactiveCount" class="sidebar-section-badge">0</span>
                                <span class="toggle-icon">▲</span>
                            </div>
                        </div>
                        <div id="inactive-bucket" class="vertical-stack-bucket"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('dragstart', (e) => e.preventDefault());
        window.addEventListener('drop', (e) => e.preventDefault());
        window.addEventListener('wheel', (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
        window.addEventListener('keydown', (e) => {
            if (e.ctrlKey && ['+', '-', '=', '0'].includes(e.key)) e.preventDefault();
        });

        const canvas = document.getElementById('canvas');
        const activeBucket = document.getElementById('active-bucket');
        const inactiveBucket = document.getElementById('inactive-bucket');
        const sidebar = document.getElementById('order-sidebar');
        const historyWrapper = document.getElementById('history-section-wrapper');
        
        let appState = { editMode: false, gridSize: 20, tableWidth: 110, tableHeight: 110 };

        function initLayout(payload) {
            appState.editMode = payload.editMode;
            appState.gridSize = payload.gridSize || 20;
            appState.tableWidth = payload.tableSize || 110;
            appState.tableHeight = payload.tableSize || 110;

            const editToggleBtn = document.getElementById('btn-edit-toggle');
            const plusBtn = document.getElementById('btn-scale-up');
            const minBtn = document.getElementById('btn-scale-down');
            const fsBtn = document.getElementById('btn-fullscreen');

            fsBtn.innerText = payload.isFullscreen ? "Venster Modus" : "Volledig Scherm";

            if (appState.editMode) {
                document.body.classList.add('edit-mode');
                editToggleBtn.innerText = "Opslaan";
                editToggleBtn.className = "pos-btn success";
                plusBtn.style.display = "flex";
                minBtn.style.display = "flex";
            } else {
                document.body.classList.remove('edit-mode');
                editToggleBtn.innerText = "Wijzig tafel locaties";
                editToggleBtn.className = "pos-btn primary";
                plusBtn.style.display = "none";
                minBtn.style.display = "none";
            }

            canvas.style.backgroundImage = payload.backgroundImage ? `url('${payload.backgroundImage}')` : 'none';
            canvas.innerHTML = '';

            payload.tables.forEach(table => {
                const el = document.createElement('div');
                el.className = `table-item ${table.isActive ? 'active' : 'vacant'}`;
                el.setAttribute('data-id', table.id);
                el.style.width = `${appState.tableWidth}px`;
                el.style.height = `${appState.tableHeight}px`;

                el.innerHTML = `
                    <svg class="table-illustration" viewBox="0 0 100 100" preserveAspectRatio="none">
                        <rect class="chair" x="2" y="35" width="10" height="30" rx="3"/>
                        <rect class="chair" x="88" y="35" width="10" height="30" rx="3"/>
                        <rect class="chair" x="35" y="2" width="30" height="10" rx="3"/>
                        <rect class="chair" x="35" y="88" width="30" height="10" rx="3"/>
                        <rect class="table-top" x="18" y="18" width="64" height="64" rx="12"/>
                    </svg>
                    <div class="table-details">
                        <div class="table-name">${table.name}</div>
                        ${table.isActive && !appState.editMode ? `<div class="table-timer">${table.minutesOpen}'m</div>` : ''}
                        ${table.isActive && !appState.editMode ? `<div class="table-price">${table.totalPrice}</div>` : ''}
                    </div>
                `;

                if (table.location && table.location.includes(',')) {
                    const [x, y] = table.location.split(',');
                    el.style.left = `${x}px`;
                    el.style.top = `${y}px`;
                } else {
                    el.style.left = "40px";
                    el.style.top = "60px";
                }

                canvas.appendChild(el);
            });

            renderBucketList(activeBucket, payload.activeOrders, 'indicator-table-open', 'Geopend', 'badgeActiveCount');
            renderBucketList(inactiveBucket, payload.inactiveOrders, 'indicator-table-closed', 'Afgesloten', 'badgeInactiveCount');
        }

        function renderBucketList(targetElement, list, indicatorClass, statusText, badgeId) {
            targetElement.innerHTML = '';
            const count = list ? list.length : 0;
            document.getElementById(badgeId).innerText = count;

            if (count === 0) {
                targetElement.innerHTML = `<div style="text-align:center; color:#64748b; padding:10px; font-size:13px;">Geen items gevonden</div>`;
                return;
            }

            list.forEach(order => {
                const card = document.createElement('div');
                card.className = `order-card ${indicatorClass}`;
                card.onclick = () => sendToWinForms({ action: 'orderClicked', orderId: order.orderId });

                card.innerHTML = `
                    <div class="address-info">
                        <div class="address-title">Tafel: ${order.idDisplay}</div>
                        <div class="order-details">
                            <span class="time-tag">Tijd: ${order.timeDisplay}</span><br>
                            Status: ${statusText}
                        </div>
                    </div>
                    <div class="price-tag">${order.totalPrice}</div>
                `;
                targetElement.appendChild(card);
            });
        }

        function toggleHistorySection() {
            historyWrapper.classList.toggle('collapsed-section');
            const icon = historyWrapper.querySelector('.toggle-icon');
            icon.innerText = historyWrapper.classList.contains('collapsed-section') ? '▼' : '▲';
        }

        function toggleSidebar() { sidebar.classList.toggle('collapsed'); }

        function toggleEditMode() {
            if (!appState.editMode) {
                sendToWinForms({ action: 'setEditMode', value: true });
            } else {
                const updates = [];
                document.querySelectorAll('.table-item').forEach(el => {
                    updates.push({
                        id: parseInt(el.getAttribute('data-id')),
                        x: parseInt(el.style.left) || 0,
                        y: parseInt(el.style.top) || 0
                    });
                });
                sendToWinForms({ action: 'saveLayout', data: updates, tableSize: appState.tableWidth });
            }
        }

        function adjustTableSizes(change) {
            appState.tableWidth = Math.max(70, Math.min(180, appState.tableWidth + change));
            appState.tableHeight = Math.max(70, Math.min(180, appState.tableHeight + change));
            document.querySelectorAll('.table-item').forEach(el => {
                el.style.width = `${appState.tableWidth}px`;
                el.style.height = `${appState.tableHeight}px`;
            });
        }

        document.addEventListener('pointerdown', (e) => {
            const el = e.target.closest('.table-item');
            if (!el) return;

            if (!appState.editMode) {
                const cleanId = parseInt(el.getAttribute('data-id'));
                sendToWinForms({ action: 'tableClicked', tableId: cleanId });
                return;
            }

            let initialLeft = parseInt(el.style.left) || 0;
            let initialTop = parseInt(el.style.top) || 0;
            let startX = e.clientX;
            let startY = e.clientY;
            
            el.setPointerCapture(e.pointerId);
            el.style.zIndex = "1000";

            const onPointerMove = (moveEvent) => {
                const deltaX = moveEvent.clientX - startX;
                const deltaY = moveEvent.clientY - startY;
                
                let targetX = Math.round((initialLeft + deltaX) / appState.gridSize) * appState.gridSize;
                let targetY = Math.round((initialTop + deltaY) / appState.gridSize) * appState.gridSize;

                targetX = Math.max(0, Math.min(targetX, canvas.clientWidth - el.clientWidth));
                targetY = Math.max(0, Math.min(targetY, canvas.clientHeight - el.clientHeight));

                el.style.left = `${targetX}px`;
                el.style.top = `${targetY}px`;
            };

            const onPointerUp = (upEvent) => {
                el.releasePointerCapture(upEvent.pointerId);
                el.style.zIndex = "";
                el.removeEventListener('pointermove', onPointerMove);
                el.removeEventListener('pointerup', onPointerUp);
            };

            el.addEventListener('pointermove', onPointerMove);
            el.addEventListener('pointerup', onPointerUp);
        });

        function sendToWinForms(data) {
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage(data);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => { sendToWinForms({ action: 'ready' }); }, 200);
        });
    </script>
</body>
</html>
