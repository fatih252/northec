<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POS Touchscreen Floorplan & Orders Dashboard</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-canvas: #111827;
            --bg-card: #1f2937;
            --bg-sidebar: #111827;
            --border-color: #374151;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            
            /* POS Context States */
            --color-vacant: #10b981;
            --color-active: #ef4444;
            --color-edit: #3b82f6;
            --color-pending: #f59e0b;
        }

        * { 
            box-sizing: border-box; 
            user-select: none; 
            -webkit-user-select: none;
            margin: 0; 
            padding: 0; 
            touch-action: none; /* Block browser pinching/scrolling entirely */
        }

        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-main); 
            color: var(--text-main); 
        }
        
        #app-container { 
            display: flex; 
            flex-direction: column; 
            width: 100%; 
            height: 100%; 
        }

        /* --- Touch Controls Top Panel Bar --- */
        #control-bar {
            height: 75px;
            background-color: var(--bg-main);
            border-bottom: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 9999;
        }

        .btn-group { display: flex; gap: 12px; align-items: center; }

        .pos-btn {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            height: 52px;
            padding: 0 22px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.12s ease, transform 0.1s ease;
        }
        .pos-btn:active { transform: scale(0.96); background-color: #374151; }
        .pos-btn.primary { background-color: #2563eb; border-color: #3b82f6; }
        .pos-btn.success { background-color: #059669; border-color: #10b981; }
        .pos-btn.danger { background-color: #b91c1c; border-color: #ef4444; }
        .pos-btn.scale-btn { width: 52px; padding: 0; justify-content: center; font-size: 22px; }

        /* --- Split Workspace Area --- */
        #workspace {
            display: flex;
            flex: 1;
            width: 100%;
            height: calc(100% - 75px);
            overflow: hidden;
            position: relative;
        }

        /* --- Viewport-Locked Canvas (NO SCROLLBARS) --- */
        #canvas-wrapper { 
            flex: 1; 
            position: relative; 
            height: 100%;
            background-color: var(--bg-canvas);
            overflow: hidden; /* Guaranteed no scrollbars */
        }
        
        #canvas { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            background-size: cover; 
            background-position: center; 
            overflow: hidden;
        }

        /* Architectural blueprint grid visible only when updating positions */
        .edit-mode #canvas {
            background-image: radial-gradient(circle, #374151 2px, transparent 2px);
            background-size: 20px 20px;
        }

        /* --- Disposable Split Window Sidebar --- */
        #order-sidebar {
            width: 400px;
            height: 100%;
            background-color: var(--bg-sidebar);
            border-left: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), width 0.25s ease;
            z-index: 50;
            overflow: hidden;
        }

        #order-sidebar.collapsed {
            width: 0px;
            border-left: none;
            transform: translateX(100%);
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-main);
        }

        .sidebar-header h2 { font-size: 18px; font-weight: 700; }

        .order-list-container {
            flex: 1;
            overflow-y: auto; /* Allow scrolling inside the sidebar list only */
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            -webkit-overflow-scrolling: touch;
        }

        /* --- Premium Sidebar Order Cards --- */
        .order-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: border-color 0.15s ease, transform 0.1s ease;
        }
        .order-card:active { transform: scale(0.98); }
        .order-card.unprocessed { border-left: 5px solid var(--color-pending); }
        .order-card.table-order { border-left: 5px solid var(--color-edit); }

        .order-card-row { display: flex; justify-content: space-between; align-items: center; }
        .order-id-label { font-weight: 700; font-size: 15px; color: var(--text-main); }
        .order-time-label { font-size: 13px; color: var(--text-muted); }
        .order-detail-label { font-size: 14px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .order-badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: uppercase; }
        .order-badge.pending { background-color: rgba(245, 158, 11, 0.2); color: var(--color-pending); }
        .order-badge.active { background-color: rgba(59, 130, 246, 0.2); color: var(--color-edit); }
        .order-price-tag { font-weight: 700; color: var(--color-vacant); font-size: 15px; }

        /* --- Graphical Table Components --- */
        .table-item {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            padding: 12px;
            cursor: pointer;
        }
        
        .edit-mode .table-item { 
            cursor: move; 
            outline: 2px dashed var(--color-edit);
            outline-offset: 4px;
        }
        .edit-mode .table-item:active { transform: scale(1.02); }

        .table-illustration {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .table-item.vacant .table-illustration .table-top { fill: #064e3b; stroke: var(--color-vacant); stroke-width: 3; }
        .table-item.vacant .table-illustration .chair { fill: #134e4a; stroke: var(--color-vacant); stroke-width: 1.5; }
        .table-item.active .table-illustration .table-top { fill: #450a0a; stroke: var(--color-active); stroke-width: 3; }
        .table-item.active .table-illustration .chair { fill: #7f1d1d; stroke: var(--color-active); stroke-width: 1.5; }

        .table-details {
            position: relative;
            z-index: 2;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 2px;
            pointer-events: none;
        }

        .table-name { font-size: 16px; font-weight: 700; color: var(--text-main); text-shadow: 0 2px 4px rgba(0,0,0,0.6); }
        .table-timer { font-size: 12px; color: #f97316; font-weight: 800; background: rgba(0, 0, 0, 0.7); padding: 2px 6px; border-radius: 6px; width: fit-content; margin: 0 auto; }
        .table-price { font-size: 13px; font-weight: 700; color: #f8fafc; background: var(--color-active); padding: 2px 8px; border-radius: 20px; margin-top: 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="control-bar">
            <div class="btn-group">
                <button id="btn-edit-toggle" class="pos-btn primary" onclick="toggleEditMode()">
                    <span>Wijzig tafel locaties</span>
                </button>
                <button id="btn-scale-up" class="pos-btn scale-btn" onclick="adjustTableSizes(10)" style="display:none">+</button>
                <button id="btn-scale-down" class="pos-btn scale-btn" onclick="adjustTableSizes(-10)" style="display:none">-</button>
            </div>

            <div class="btn-group">
                <button class="pos-btn" onclick="toggleSidebar()">Bestellingen Lijst</button>
                <button class="pos-btn" onclick="sendToWinForms({action: 'triggerBackgroundPicker'})">Achtergrond Laden</button>
                <button class="pos-btn" onclick="sendToWinForms({action: 'removeBackground'})" style="color: var(--text-muted)">Wissen</button>
                <button class="pos-btn danger" onclick="sendToWinForms({action: 'resetLayout'})">Reset Layout</button>
                <button id="btn-fullscreen" class="pos-btn" onclick="sendToWinForms({action: 'toggleFullscreen'})">Volledig Scherm</button>
                <button class="pos-btn" style="background-color: #4b5563;" onclick="sendToWinForms({action: 'closeForm'})">Sluiten</button>
            </div>
        </div>

        <div id="workspace">
            <div id="canvas-wrapper">
                <div id="canvas"></div>
            </div>

            <div id="order-sidebar" class="collapsed">
                <div class="sidebar-header">
                    <h2>Actieve Bestellingen</h2>
                    <button class="pos-btn scale-btn" style="height: 36px; width: 36px; font-size: 14px;" onclick="toggleSidebar()">✕</button>
                </div>
                <div class="order-list-container" id="order-list-target">
                    </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const orderListTarget = document.getElementById('order-list-target');
        const sidebar = document.getElementById('order-sidebar');
        let appState = { editMode: false, gridSize: 20, tableWidth: 120, tableHeight: 120 };

        function initLayout(payload) {
            appState.editMode = payload.editMode;
            appState.gridSize = payload.gridSize || 20;

            const editToggleBtn = document.getElementById('btn-edit-toggle');
            const plusBtn = document.getElementById('btn-scale-up');
            const minBtn = document.getElementById('btn-scale-down');
            const fsBtn = document.getElementById('btn-fullscreen');

            fsBtn.innerText = payload.isFullscreen ? "Venster Modus" : "Volledig Scherm";

            if (appState.editMode) {
                document.body.classList.add('edit-mode');
                editToggleBtn.innerText = "Opslaan";
                editToggleBtn.className = "pos-btn success";
                plusBtn.style.display = "flex";
                minBtn.style.display = "flex";
            } else {
                document.body.classList.remove('edit-mode');
                editToggleBtn.innerText = "Wijzig tafel locaties";
                editToggleBtn.className = "pos-btn primary";
                plusBtn.style.display = "none";
                minBtn.style.display = "none";
            }

            canvas.style.backgroundImage = payload.backgroundImage ? `url('${payload.backgroundImage}')` : 'none';
            canvas.innerHTML = '';

            // 1. Render Interactive Floorplan Canvas Tables
            payload.tables.forEach(table => {
                const el = document.createElement('div');
                el.className = `table-item ${table.isActive ? 'active' : 'vacant'}`;
                el.setAttribute('data-id', table.id);
                el.style.width = `${appState.tableWidth}px`;
                el.style.height = `${appState.tableHeight}px`;

                el.innerHTML = `
                    <svg class="table-illustration" viewBox="0 0 100 100" preserveAspectRatio="none">
                        <rect class="chair" x="2" y="35" width="10" height="30" rx="3"/>
                        <rect class="chair" x="88" y="35" width="10" height="30" rx="3"/>
                        <rect class="chair" x="35" y="2" width="30" height="10" rx="3"/>
                        <rect class="chair" x="35" y="88" width="30" height="10" rx="3"/>
                        <rect class="table-top" x="18" y="18" width="64" height="64" rx="12"/>
                    </svg>
                    <div class="table-details">
                        <div class="table-name">${table.name}</div>
                        ${table.isActive && !appState.editMode ? `<div class="table-timer">${table.minutesOpen}'m</div>` : ''}
                        ${table.isActive && !appState.editMode ? `<div class="table-price">${table.totalPrice}</div>` : ''}
                    </div>
                `;

                if (table.location && table.location.includes(',')) {
                    const [x, y] = table.location.split(',');
                    el.style.left = `${x}px`;
                    el.style.top = `${y}px`;
                } else {
                    el.style.left = "40px";
                    el.style.top = "100px";
                }

                // Force layout containment parameters inside the viewport bounds right now
                clampElementToCanvas(el);

                attachInteractions(el);
                canvas.appendChild(el);
            });

            // 2. Render Sidebar Order Feed List
            orderListTarget.innerHTML = '';
            if (payload.orders && payload.orders.length > 0) {
                payload.orders.forEach(order => {
                    const card = document.createElement('div');
                    card.className = `order-card ${order.processed ? 'table-order' : 'unprocessed'}`;
                    card.onclick = () => sendToWinForms({ action: 'orderClicked', orderId: order.orderId });

                    card.innerHTML = `
                        <div class="order-card-row">
                            <span class="order-id-label">Bestelling #${order.idDisplay}</span>
                            <span class="order-time-label">${order.timeDisplay}</span>
                        </div>
                        <div class="order-detail-label">${order.destination}</div>
                        <div class="order-card-row" style="margin-top: 4px;">
                            <span class="order-badge ${order.processed ? 'active' : 'pending'}">
                                ${order.processed ? 'Actief' : 'Nieuw'}
                            </span>
                            <span class="order-price-tag">${order.totalPrice}</span>
                        </div>
                    `;
                    orderListTarget.appendChild(card);
                });
            } else {
                orderListTarget.innerHTML = `<div style="text-align:center; color:var(--text-muted); margin-top:40px; font-size:14px;">Geen actieve bestellingen gevonden</div>`;
            }
        }

        function toggleSidebar() {
            sidebar.classList.toggle('collapsed');
            // Re-enforce bounding constraints across all elements since the layout width shifted
            setTimeout(() => {
                document.querySelectorAll('.table-item').forEach(el => clampElementToCanvas(el));
            }, 300);
        }

        function toggleEditMode() {
            if (!appState.editMode) {
                sendToWinForms({ action: 'setEditMode', value: true });
            } else {
                const updates = [];
                document.querySelectorAll('.table-item').forEach(el => {
                    updates.push({
                        id: parseInt(el.getAttribute('data-id')),
                        x: parseInt(el.style.left) || 0,
                        y: parseInt(el.style.top) || 0
                    });
                });
                sendToWinForms({ action: 'saveLayout', data: updates });
            }
        }

        function adjustTableSizes(change) {
            appState.tableWidth = Math.max(80, Math.min(200, appState.tableWidth + change));
            appState.tableHeight = Math.max(80, Math.min(200, appState.tableHeight + change));
            document.querySelectorAll('.table-item').forEach(el => {
                el.style.width = `${appState.tableWidth}px`;
                el.style.height = `${appState.tableHeight}px`;
                clampElementToCanvas(el);
            });
        }

        function clampElementToCanvas(element) {
            let currentX = parseInt(element.style.left) || 0;
            let currentY = parseInt(element.style.top) || 0;

            let maxAllowedX = canvas.clientWidth - element.clientWidth;
            let maxAllowedY = canvas.clientHeight - element.clientHeight;

            // Prevent layout crash if wrapper has not parsed explicit width yet
            if (maxAllowedX < 0) maxAllowedX = 0;
            if (maxAllowedY < 0) maxAllowedY = 0;

            let clampedX = Math.max(0, Math.min(currentX, maxAllowedX));
            let clampedY = Math.max(0, Math.min(currentY, maxAllowedY));

            // Force alignment to grid spacing rules directly during sizing corrections
            clampedX = Math.round(clampedX / appState.gridSize) * appState.gridSize;
            clampedY = Math.round(clampedY / appState.gridSize) * appState.gridSize;

            element.style.left = `${clampedX}px`;
            element.style.top = `${clampedY}px`;
        }

        function attachInteractions(element) {
            let isDragging = false;
            let startX, startY, initialLeft, initialTop;

            element.addEventListener('pointerdown', (e) => {
                if (!appState.editMode) {
                    const cleanId = parseInt(element.getAttribute('data-id'));
                    sendToWinForms({ action: 'tableClicked', tableId: cleanId });
                    return;
                }
                isDragging = true;
                element.setPointerCapture(e.pointerId);
                initialLeft = parseInt(element.style.left) || 0;
                initialTop = parseInt(element.style.top) || 0;
                startX = e.clientX;
                startY = e.clientY;
                element.style.zIndex = "1000";
            });

            element.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                
                const deltaX = e.clientX - startX;
                const deltaY = e.clientY - startY;
                
                let unalignedX = initialLeft + deltaX;
                let unalignedY = initialTop + deltaY;

                let alignedX = Math.round(unalignedX / appState.gridSize) * appState.gridSize;
                let alignedY = Math.round(unalignedY / appState.gridSize) * appState.gridSize;

                // Viewport boundary containment constraints checks
                alignedX = Math.max(0, Math.min(alignedX, canvas.clientWidth - element.clientWidth));
                alignedY = Math.max(0, Math.min(alignedY, canvas.clientHeight - element.clientHeight));

                element.style.left = `${alignedX}px`;
                element.style.top = `${alignedY}px`;
            });

            element.addEventListener('pointerup', (e) => {
                if (!isDragging) return;
                isDragging = false;
                element.releasePointerCapture(e.pointerId);
                element.style.zIndex = "";
            });
        }

        function sendToWinForms(data) {
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage(data);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => { sendToWinForms({ action: 'ready' }); }, 200);
        });
    </script>
</body>
</html>
