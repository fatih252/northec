<div style="text-align: center; margin-top: 30px;">
    <button id="btnClose" class="close-btn">Got it, thanks!</button>
</div>

<style>
    .close-btn {
        background-color: #2563eb;
        color: white;
        border: none;
        padding: 12px 30px;
        border-radius: 6px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
    }
    .close-btn:hover {
        background-color: #1d4ed8;
    }
</style>

<script>
    // This script communicates with your C# code
    document.getElementById('btnClose').addEventListener('click', () => {
        if (window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage('close_release_notes');
        }
    });
</script>
