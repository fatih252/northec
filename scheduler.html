<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Winkel Planner Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.10/locales/nl.global.min.js"></script>
    
    <style>
        :root {
            --primary: #007bff;
            --danger: #dc3545;
            --warning: #fd7e14;
            --success: #28a745;
            --bg-sidebar: #ffffff;
            --bg-page: #f4f6f9;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            display: flex; margin: 0; background: var(--bg-page); 
            height: 100vh; overflow: hidden; 
            /* Voorkom dat de hele pagina ongewenst scrollt of inzoomt bij touch-slepen */
            touch-action: pan-x pan-y;
        }

        #sidebar { 
            width: 350px; background: var(--bg-sidebar); padding: 20px; 
            border-right: 1px solid #dee2e6; display: flex;
            flex-direction: column; box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            z-index: 10;
        }

        h3 { margin-top: 0; color: #333; border-bottom: 2px solid var(--primary); padding-bottom: 10px; }

        .input-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; color: #495057; font-size: 0.85em; }
        
        input[type="date"], input[type="text"] { 
            width: 100%; padding: 12px; border: 1px solid #ced4da; 
            border-radius: 4px; box-sizing: border-box; font-size: 1em;
        }

        /* Banner styling */
        .banner-preview {
            background: #fff3cd; border: 1px solid #ffeeba;
            padding: 8px; border-radius: 4px; font-size: 0.8em;
            margin-top: 5px; color: #856404; display: none;
        }

        .btn { 
            width: 100%; padding: 14px; border: none; border-radius: 4px; 
            cursor: pointer; font-weight: bold; margin-bottom: 10px; font-size: 14px;
            transition: all 0.2s;
            /* Groter touchoppervlak voor vingers */
            min-height: 48px;
        }
        #btnConfirm { background: var(--success); color: white; display: none; }
        #btnCancel { background: #6c757d; color: white; display: none; }

        #listHeader { margin-top: 20px; font-size: 0.9em; font-weight: bold; color: #666; }
        #scheduleList { flex-grow: 1; overflow-y: auto; margin-top: 10px; }

        .planning-card { 
            background: #fff; border: 1px solid #e9ecef; border-left: 5px solid var(--primary); 
            padding: 14px; margin-bottom: 10px; border-radius: 4px; 
            display: flex; justify-content: space-between; align-items: center;
        }
        .planning-card.active { border-left-color: var(--warning); background-color: #fffaf0; }

        /* Grotere sluitknop voor touchscreens */
        .btn-del { 
            background: none; color: #adb5bd; border: none; cursor: pointer; 
            font-size: 1.5em; padding: 10px; min-width: 44px; min-height: 44px;
        }
        .btn-del:hover { color: var(--danger); }
        #calendar-container { flex-grow: 1; padding: 20px; background: white; }

        /* Zorg dat datums op touchscreens makkelijker aan te tikken zijn */
        .fc .fc-daygrid-day-number {
            padding: 8px !important;
            font-size: 1.1em;
        }
    </style>
</head>
<body>

<div id="sidebar">
    <h3>Winkel Planning</h3>
    
    <div class="input-group">
        <label>Sluiten vanaf:</label>
        <input type="date" id="startInput">
    </div>
    
    <div class="input-group">
        <label>Weer open op:</label>
        <input type="date" id="endInput">
    </div>

    <div class="input-group" id="bannerGroup" style="display:none;">
        <label>Banner Tekst (Suggestie):</label>
        <input type="text" id="bannerInput" placeholder="Bijv: Wegens vakantie gesloten">
        <div id="bannerHint" class="banner-preview">Test suggestie gegenereerd!</div>
    </div>

    <button id="btnConfirm" class="btn">Planning & Banner Opslaan</button>
    <button id="btnCancel" class="btn">Annuleren</button>

    <div id="listHeader">ACTIEVE PLANNINGEN</div>
    <div id="scheduleList">
        <p style="color:gray; font-size:0.8em;">Laden...</p>
    </div>
</div>

<div id="calendar-container">
    <div id="calendar"></div>
</div>

<script>
    let calendar;
    const startInput = document.getElementById('startInput');
    const endInput = document.getElementById('endInput');
    const bannerInput = document.getElementById('bannerInput');
    const bannerGroup = document.getElementById('bannerGroup');
    const btnConfirm = document.getElementById('btnConfirm');
    const btnCancel = document.getElementById('btnCancel');
    const listDiv = document.getElementById('scheduleList');
    const todayStr = new Date().toISOString().split('T')[0];

    document.addEventListener('DOMContentLoaded', function() {
        startInput.min = todayStr;
        endInput.min = todayStr;

        calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
            initialView: 'dayGridMonth',
            locale: 'nl',
            selectable: true,
            unselectAuto: false,
            validRange: { start: todayStr },
            
            // --- TOUCHSCREEN OPTIMALISATIES ---
            longPressDelay: 0,        // Reageert direct op aanraking in plaats van 1 sec te moeten wachten
            selectLongPressDelay: 0,  // Verwijdert de vertraging specifiek voor datums selecteren
            selectMirror: true,       // Toont direct een visuele selectie-balk tijdens het slepen op touch

            select: function(info) {
                startInput.value = info.startStr;
                let d = new Date(info.end); d.setDate(d.getDate() - 1);
                const endDateStr = d.toISOString().split('T')[0];
                endInput.value = endDateStr;
                
                // --- Suggestie Test Logica ---
                generateBannerSuggestion(info.startStr, endDateStr);
                
                toggleButtons(true);
            }
        });
        calendar.render();
    });

    function generateBannerSuggestion(start, end) {
        const msg = `Let op: Winkel gesloten van ${start} t/m ${end}.`;
        bannerInput.value = msg;
        bannerGroup.style.display = 'block';
        document.getElementById('bannerHint').style.display = 'block';
    }

    function toggleButtons(show) {
        btnConfirm.style.display = show ? 'block' : 'none';
        btnCancel.style.display = show ? 'block' : 'none';
        if(!show) bannerGroup.style.display = 'none';
    }

    btnCancel.onclick = () => {
        calendar.unselect();
        startInput.value = ''; endInput.value = ''; bannerInput.value = '';
        toggleButtons(false);
    };

    btnConfirm.onclick = () => {
        if (new Date(endInput.value) < new Date(startInput.value)) {
            alert("Einddatum is ongeldig."); return;
        }

        window.chrome.webview.postMessage({ 
            startDate: startInput.value, 
            endDate: endInput.value,
            bannerText: bannerInput.value, 
            shopId: 101 
        });
        btnCancel.onclick();
    };

    function updateUI(data) {
        listDiv.innerHTML = '';
        calendar.getEvents().forEach(e => e.remove());
        data.forEach(group => {
            const fromStr = group.FromDate.split('T')[0];
            const tillStr = group.TillDate.split('T')[0];
            const isClosed = group.IsCurrentlyClosed;

            const card = document.createElement('div');
            card.className = 'planning-card' + (isClosed ? ' active' : '');
            card.innerHTML = `
                <div class="planning-info">
                    <strong>${fromStr} t/m ${tillStr}</strong><br>
                    <small>${isClosed ? '⚠️ NU GESLOTEN' : '📅 INGEPLAND'}</small>
                </div>
                <button class="btn-del" onclick="deleteItem('${group.JobId}', ${isClosed})">✕</button>
            `;
            listDiv.appendChild(card);

            // Zorg voor een correct exclusief einde op de kalender
            let endCal = new Date(group.TillDate);
            endCal.setDate(endCal.getDate() + 1);

            calendar.addEvent({
                id: group.JobId,
                title: isClosed ? 'DICHT' : 'GEPLAND',
                start: group.FromDate,
                end: endCal.toISOString().split('T')[0],
                allDay: true,
                backgroundColor: isClosed ? '#fd7e14' : '#dc3545'
            });
        });
    }

    function deleteItem(jobId, isClosed) {
        const msg = isClosed ? "WAARSCHUWING: Winkel is nu dicht! Verwijderen?" : "Planning verwijderen?";
        if(confirm(msg)) {
            window.chrome.webview.postMessage({ deleteId: jobId.toString() });
        }
    }
</script>
</body>
</html>
