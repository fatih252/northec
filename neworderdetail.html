<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Northec POS - Product Opties</title>
    <style>
        :root {
            --bg-color: #111827; 
            --surface-color: #1F2937;
            --primary-color: #3B82F6; 
            --primary-active: #2563EB;
            --success-color: #10B981; 
            --success-active: #059669;
            --warning-color: #F59E0B;
            --text-main: #F9FAFB; 
            --text-muted: #9CA3AF; 
            --border-color: #374151; 
            --danger-color: #EF4444;
            --danger-active: #DC2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            border-radius: 0 !important; 
        }

        body {
            background-color: var(--bg-color);
            height: 100vh;
            overflow: hidden;
            display: flex;
            color: var(--text-main);
        }

        .layout { display: flex; width: 100%; height: 100vh; }

        /* --- LEFT: Types & Prefixes --- */
        .sidebar {
            width: 280px;
            background-color: var(--surface-color);
            border-right: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .prefix-container {
            display: flex;
            flex-direction: column;
            border-bottom: 2px solid var(--border-color);
        }

        .prefix-btn {
            padding: 25px 15px;
            font-size: 22px;
            font-weight: 900;
            text-align: center;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-muted);
            background-color: var(--bg-color);
            transition: all 0.1s;
        }

        .prefix-btn.plus.active { background-color: var(--success-color); color: white; }
        .prefix-btn.minus.active { background-color: var(--danger-color); color: white; }
        .prefix-btn.enkel.active { background-color: var(--warning-color); color: white; }

        .types-list {
            flex: 1;
            overflow-y: auto;
            scrollbar-width: none;
        }
        .types-list::-webkit-scrollbar { display: none; }

        .type-btn {
            padding: 25px 15px;
            font-size: 18px;
            font-weight: 800;
            border-bottom: 1px solid var(--border-color);
            border-left: 6px solid transparent;
            cursor: pointer;
            color: var(--text-main);
        }
        .type-btn:active { background-color: var(--border-color); }
        .type-btn.active {
            background-color: var(--bg-color);
            color: var(--primary-color);
            border-left-color: var(--primary-color);
        }

        /* --- CENTER: Modifiers Grid --- */
        .modifiers-zone {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
        }

        .header-bar {
            padding: 20px;
            background-color: var(--surface-color);
            border-bottom: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .product-title {
            font-size: 24px;
            font-weight: 900;
            color: var(--primary-color);
        }

        .btn-cancel {
            background-color: var(--border-color);
            color: var(--text-main);
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-cancel:active { opacity: 0.8; }

        .modifiers-grid {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            align-content: start;
        }

        .mod-card {
            background-color: var(--surface-color);
            border: 2px solid var(--border-color);
            padding: 20px 15px;
            height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
        }
        .mod-card:active {
            background-color: var(--border-color);
            border-color: var(--primary-color);
        }

        .mod-name { font-size: 18px; font-weight: 800; line-height: 1.2; }
        .mod-price { font-size: 16px; font-weight: 700; color: var(--text-muted); text-align: right; }

        /* --- RIGHT: Sub Cart & Submit --- */
        .cart-zone {
            width: 380px;
            background-color: var(--surface-color);
            border-left: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .cart-items {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: var(--bg-color);
        }

        .cart-item {
            background-color: var(--surface-color);
            border: 2px solid var(--border-color);
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .cart-item.success .item-name { color: var(--success-color); }
        .cart-item.danger .item-name { color: var(--danger-color); text-decoration: line-through; }
        
        .item-name { font-size: 18px; font-weight: 800; }
        .item-price { font-size: 16px; font-weight: 700; color: var(--text-muted); }
        
        .btn-remove {
            background-color: var(--danger-color);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            font-size: 20px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-remove:active { background-color: var(--danger-active); }

        .checkout-panel {
            padding: 15px;
            border-top: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .totals-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 28px;
            font-weight: 900;
            color: var(--text-main);
        }

        .btn-submit {
            background-color: #8B0000; /* DarkRed matches old design */
            color: white;
            border: none;
            padding: 25px;
            font-size: 24px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }
        .btn-submit:active { background-color: #660000; }

    </style>
</head>
<body>

    <div class="layout">
        
        <div class="sidebar">
            <div class="prefix-container">
                <div class="prefix-btn plus active" onclick="setPrefix('+')">+ EXTRA</div>
                <div class="prefix-btn minus" onclick="setPrefix('-')">- ZONDER</div>
                <div class="prefix-btn enkel" onclick="setPrefix('> enkel')">ENKEL</div>
            </div>
            <div class="types-list" id="typesContainer">
                </div>
        </div>

        <div class="modifiers-zone">
            <div class="header-bar">
                <div class="product-title" id="lblProductTitle">Laden...</div>
                <button class="btn-cancel" onclick="sendHostMessage({action: 'cancel'})">ANNULEREN</button>
            </div>
            <div class="modifiers-grid" id="modifiersContainer">
                </div>
        </div>

        <div class="cart-zone">
            <div class="cart-items" id="subCartContainer">
                </div>
            
            <div class="checkout-panel">
                <div class="totals-row">
                    <span>TOTAAL</span>
                    <span id="lblTotalPrice">€ 0.00</span>
                </div>
                <button class="btn-submit" onclick="sendHostMessage({action: 'submit_product'})">VOEG TOE</button>
            </div>
        </div>
        
    </div>

    <script>
        let currentPrefix = '+';
        let currentBasePrice = 0;

        document.addEventListener("DOMContentLoaded", () => {
            sendHostMessage({ action: "ui_ready" });
        });

        function sendHostMessage(payload) {
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage(payload);
            }
        }

        // --- HOST TO JS BINDINGS ---
        
        window.initProduct = function(data) {
            document.getElementById('lblProductTitle').innerText = data.productName.toUpperCase();
            currentBasePrice = data.basePrice;
        };

        window.renderTypes = function(types) {
            const container = document.getElementById("typesContainer");
            container.innerHTML = "";
            types.forEach(t => {
                const btn = document.createElement("div");
                btn.className = "type-btn";
                btn.id = "type_" + t.id;
                btn.innerText = t.name;
                
                btn.onclick = () => {
                    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    sendHostMessage({ action: "load_type_items", typeId: t.id, isProductExtra: t.isProductExtra });
                };
                container.appendChild(btn);
            });
            if (types.length > 0) document.getElementById("type_" + types[0].id).click();
        };

        window.renderModifiers = function(items, isProductExtra) {
            const container = document.getElementById("modifiersContainer");
            container.innerHTML = "";
            items.forEach(item => {
                const card = document.createElement("div");
                card.className = "mod-card";
                card.innerHTML = `
                    <div class="mod-name">${item.name}</div>
                    <div class="mod-price">+ € ${item.price.toFixed(2)}</div>
                `;
                card.onclick = () => {
                    sendHostMessage({ 
                        action: "add_modifier", 
                        isProductExtra: isProductExtra, 
                        prefix: currentPrefix, 
                        rawData: item.rawData 
                    });
                };
                container.appendChild(card);
            });
        };

        window.renderSubCart = function(data) {
            document.getElementById('lblTotalPrice').innerText = "€ " + data.total.toFixed(2);
            
            const container = document.getElementById("subCartContainer");
            container.innerHTML = "";

            data.items.forEach(item => {
                const row = document.createElement("div");
                row.className = `cart-item ${item.color}`;
                
                row.innerHTML = `
                    <div>
                        <div class="item-name">${item.displayName}</div>
                        <div class="item-price">€ ${item.price.toFixed(2)}</div>
                    </div>
                    <button class="btn-remove" onclick="removeModifier(${item.uniqueId}, ${item.isProductExtra})">X</button>
                `;
                container.appendChild(row);
            });
            container.scrollTop = container.scrollHeight;
        };

        // --- UI LOGIC ---

        function setPrefix(prefix) {
            currentPrefix = prefix;
            document.querySelectorAll('.prefix-btn').forEach(b => b.classList.remove('active'));
            if(prefix === '+') document.querySelector('.prefix-btn.plus').classList.add('active');
            if(prefix === '-') document.querySelector('.prefix-btn.minus').classList.add('active');
            if(prefix === '> enkel') document.querySelector('.prefix-btn.enkel').classList.add('active');
        }

        function removeModifier(uniqueId, isProductExtra) {
            sendHostMessage({ 
                action: "remove_modifier", 
                uniqueId: uniqueId, 
                isProductExtra: isProductExtra 
            });
        }

    </script>
</body>
</html>
