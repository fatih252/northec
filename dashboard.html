<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PizzaApp Tabbed Dashboard</title>
    <style>
        :root {
            --pizza-red: #973030;
            --pizza-green: #71A783;
            --pizza-blue: #B3DAFF;
            --bg-gray: #E0E0E0;
            --card-white: #FFFFFF;
            --tab-inactive: #c0c0c0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-gray);
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
        }

        /* Tab Navigation Bar */
        .tab-bar {
            display: flex;
            background-color: #d3d3d3;
            border-bottom: 2px solid var(--pizza-red);
        }

        .tab-button {
            flex: 1;
            padding: 15px;
            border: none;
            outline: none;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
            background-color: var(--tab-inactive);
            color: #444;
            transition: 0.3s;
        }

        .tab-button.active {
            background-color: var(--pizza-red);
            color: white;
        }

        .tab-button:hover:not(.active) {
            background-color: #b0b0b0;
        }

        /* Container Logic */
        .content-container {
            height: calc(100vh - 55px);
            position: relative;
        }

        .order-column {
            display: none; /* Hidden by default */
            padding: 15px;
            height: 100%;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .order-column.active {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Order Card Styling */
        .order-card {
            background-color: var(--card-white);
            border-radius: 6px;
            padding: 15px;
            display: grid;
            grid-template-columns: 1fr 120px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            cursor: pointer;
            border-left: 10px solid transparent;
        }

        .address { font-weight: bold; font-size: 1.1rem; }
        .price { font-size: 1.3rem; font-weight: 900; color: var(--pizza-red); text-align: right; }
        .time-badge { font-size: 0.9rem; color: #666; margin-top: 5px; }

        /* Status Classes */
        .status-new { background-color: var(--pizza-green) !important; color: white !important; }
        .status-draft { background-color: var(--pizza-blue) !important; }
        .flash { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0.6; } }

        /* Notification Badge on Tabs */
        .badge {
            background: red;
            color: white;
            border-radius: 50%;
            padding: 2px 8px;
            font-size: 0.8rem;
            margin-left: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="tab-bar">
        <button class="tab-button active" onclick="openTab('online')">
            Online Bestellingen <span id="onlineBadge" class="badge">0</span>
        </button>
        <button class="tab-button" onclick="openTab('kassa')">
            Kassa Bestellingen <span id="kassaBadge" class="badge">0</span>
        </button>
    </div>

    <div class="content-container">
        <div id="onlineColumn" class="order-column active">
            </div>
        <div id="kassaColumn" class="order-column">
            </div>
    </div>

    <script>
        let lastData = { online: [], pos: [] };

        // Toggle between Online and Kassa
        function openTab(tabName) {
            // Update Buttons
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');

            // Update Columns
            document.getElementById('onlineColumn').classList.remove('active');
            document.getElementById('kassaColumn').classList.remove('active');

            if(tabName === 'online') document.getElementById('onlineColumn').classList.add('active');
            else document.getElementById('kassaColumn').classList.add('active');
        }

        // Receive data from C#
        window.chrome.webview.addEventListener('message', event => {
            const data = event.data;
            lastData = data;
            
            renderList('onlineColumn', data.online);
            renderList('kassaColumn', data.pos);
            updateBadges(data);
        });

        function updateBadges(data) {
            const onlineNew = data.online.filter(o => !o.processed).length;
            const kassaNew = data.pos.filter(o => !o.processed).length;

            const oBadge = document.getElementById('onlineBadge');
            const kBadge = document.getElementById('kassaBadge');

            oBadge.style.display = onlineNew > 0 ? 'inline-block' : 'none';
            oBadge.innerText = onlineNew;

            kBadge.style.display = kassaNew > 0 ? 'inline-block' : 'none';
            kBadge.innerText = kassaNew;
        }

        function renderList(containerId, orders) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            orders.forEach(order => {
                const card = document.createElement('div');
                card.className = 'order-card';
                
                if (!order.processed || order.order_status_code == "1") {
                    card.classList.add('status-new', 'flash');
                } else if (order.order_status_code == "3") {
                    card.classList.add('status-draft');
                }

                const addressText = order.take_away ? `Afhaling: ${order.phone_no}` : (order.table_name ? `Tafel: ${order.table_name}` : order.address);
                const priceText = `€${parseFloat(order.value).toFixed(2)}`;

                card.innerHTML = `
                    <div>
                        <div class="address">${addressText}</div>
                        <div class="time-badge">${order.desired_del_time}</div>
                    </div>
                    <div class="price">${priceText}</div>
                `;

                card.onclick = () => {
                    window.chrome.webview.postMessage({ action: "open_order", orderId: order.order_id });
                };

                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
