<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POS Touchscreen Ordering</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-panel: #1e293b;
            --border-color: #334155;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --accent-red: #dc2626;
            --accent-green: #16a34a;
            --accent-blue: #2563eb;
            --btn-active: #3b82f6;
        }

        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; touch-action: pan-y; }
        
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-main); color: var(--text-light); }

        #pos-layout { display: flex; width: 100%; height: 100%; }

        /* --- LEFT: Categories Column --- */
        #col-categories {
            width: 220px;
            background-color: var(--bg-panel);
            border-right: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        
        .cat-btn {
            min-height: 70px;
            padding: 15px;
            background: transparent;
            color: var(--text-light);
            border: none;
            border-bottom: 1px solid var(--border-color);
            font-size: 16px;
            font-weight: 700;
            text-align: left;
            cursor: pointer;
            transition: background 0.1s;
        }
        .cat-btn.active { background-color: var(--accent-red); border-left: 6px solid #fca5a5; }
        .cat-btn:active { background-color: #334155; }

        /* --- CENTER: Products Grid --- */
        #col-products {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            align-content: start;
        }

        .prod-btn {
            background-color: #334155;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .prod-btn:active { transform: scale(0.96); background-color: var(--btn-active); border-color: var(--btn-active); }
        .prod-name { font-weight: 800; font-size: 15px; margin-bottom: 5px; }
        .prod-price { font-weight: 600; color: #a7f3d0; font-size: 14px; }

        /* --- RIGHT: Shopping Cart --- */
        #col-cart {
            width: 380px;
            background-color: var(--bg-panel);
            border-left: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        #cart-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        
        .cart-item {
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .cart-item-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .cart-item-title { font-weight: 700; font-size: 15px; }
        .cart-item-price { font-weight: 800; color: var(--accent-green); }
        .cart-item-options { font-size: 12px; color: var(--text-muted); line-height: 1.4; white-space: pre-wrap; }
        
        .cart-controls { display: flex; gap: 6px; margin-top: 5px; }
        .ctrl-btn { flex: 1; background: #334155; border: none; color: white; height: 36px; border-radius: 6px; font-weight: bold; font-size: 18px; cursor: pointer; }
        .ctrl-btn:active { background: #475569; }

        /* --- Cart Footer / Actions --- */
        #cart-footer { padding: 15px; background: #0b0f19; border-top: 2px solid var(--border-color); }
        
        .totals-row { display: flex; justify-content: space-between; font-size: 24px; font-weight: 900; margin-bottom: 15px; color: var(--accent-green); }
        
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .action-btn { height: 60px; font-size: 15px; font-weight: 800; border: none; border-radius: 8px; color: white; cursor: pointer; text-transform: uppercase; }
        .action-btn:active { transform: scale(0.97); }
        
        .btn-pay { grid-column: span 2; background-color: var(--accent-green); height: 70px; font-size: 18px; }
        .btn-table { background-color: var(--accent-blue); }
        .btn-takeaway { background-color: #d97706; }
        .btn-delivery { background-color: var(--accent-red); }
        .btn-discount { background-color: #475569; }
    </style>
</head>
<body>

    <div id="pos-layout">
        <div id="col-categories"></div>
        <div id="col-products"></div>
        
        <div id="col-cart">
            <div id="cart-list"></div>
            <div id="cart-footer">
                <div class="totals-row">
                    <span>Totaal</span>
                    <span id="cart-total">€ 0.00</span>
                </div>
                <div class="action-grid" id="action-buttons"></div>
            </div>
        </div>
    </div>

    <script>
        // Data State
        let categories = [];
        let products = [];
        let cart = [];
        let orderState = 0; // Defines which checkout buttons show
        
        function sendToWinForms(action, payload = {}) {
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage({ action, ...payload });
            }
        }

        // Master UI Updater (Called by C#)
        function updateUI(payload) {
            if (payload.categories) renderCategories(payload.categories);
            if (payload.products) renderProducts(payload.products);
            if (payload.cart) renderCart(payload.cart, payload.total);
            
            if (payload.orderState !== undefined) {
                orderState = payload.orderState;
                renderActionButtons();
            }
        }

        // --- Render Functions ---
        function renderCategories(cats) {
            const container = document.getElementById('col-categories');
            container.innerHTML = '';
            cats.forEach(c => {
                const btn = document.createElement('button');
                btn.className = `cat-btn ${c.isActive ? 'active' : ''}`;
                if(c.color) btn.style.borderLeftColor = c.color;
                btn.innerText = c.name;
                btn.onclick = () => sendToWinForms('categoryClicked', { id: c.id });
                container.appendChild(btn);
            });
        }

        function renderProducts(prods) {
            const container = document.getElementById('col-products');
            container.innerHTML = '';
            prods.forEach(p => {
                const btn = document.createElement('div');
                btn.className = 'prod-btn';
                if(p.color) btn.style.backgroundColor = p.color;
                
                btn.innerHTML = `
                    <div class="prod-name">${p.name}</div>
                    <div class="prod-price">€${p.price.toFixed(2)}</div>
                `;
                btn.onclick = () => sendToWinForms('productClicked', { id: p.id, mainId: p.mainId });
                container.appendChild(btn);
            });
        }

        function renderCart(cartItems, total) {
            const container = document.getElementById('cart-list');
            container.innerHTML = '';
            document.getElementById('cart-total').innerText = `€ ${total.toFixed(2)}`;

            cartItems.forEach(item => {
                const row = document.createElement('div');
                row.className = 'cart-item';
                
                // Construct details string (options, extras, comments)
                let details = '';
                if(item.details && item.details.length > 0) {
                    details = `<div class="cart-item-options">${item.details.join('\n')}</div>`;
                }

                row.innerHTML = `
                    <div class="cart-item-header" onclick="sendToWinForms('editCartItem', { lineId: '${item.lineId}' })">
                        <div class="cart-item-title">${item.amount}x ${item.name}</div>
                        <div class="cart-item-price">€${item.lineTotal.toFixed(2)}</div>
                    </div>
                    ${details}
                    <div class="cart-controls">
                        <button class="ctrl-btn" onclick="sendToWinForms('decreaseQty', { lineId: '${item.lineId}' })">-</button>
                        <button class="ctrl-btn" onclick="sendToWinForms('increaseQty', { lineId: '${item.lineId}' })">+</button>
                        <button class="ctrl-btn" style="background:#dc2626;" onclick="sendToWinForms('deleteItem', { lineId: '${item.lineId}' })">🗑</button>
                    </div>
                `;
                container.appendChild(row);
            });
            // Auto scroll to bottom
            container.scrollTop = container.scrollHeight;
        }

        function renderActionButtons() {
            const container = document.getElementById('action-buttons');
            container.innerHTML = '';

            // Layout changes based on if it's an existing Table Order or New Order
            if (orderState === 10 || orderState === 11) {
                // Table Mode Edit
                container.innerHTML = `
                    <button class="action-btn btn-table" onclick="sendToWinForms('updateOrder')">Inchecken</button>
                    <button class="action-btn btn-pay" style="grid-column: 2;" onclick="sendToWinForms('closeOrder')">Uitchecken</button>
                `;
            } else {
                // Standard POS
                container.innerHTML = `
                    <button class="action-btn btn-table" onclick="sendToWinForms('checkoutType', { type: 'table' })">Tafel</button>
                    <button class="action-btn btn-takeaway" onclick="sendToWinForms('checkoutType', { type: 'takeaway' })">Afhaal</button>
                    <button class="action-btn btn-delivery" onclick="sendToWinForms('checkoutType', { type: 'delivery' })">Bezorging</button>
                    <button class="action-btn btn-discount" onclick="sendToWinForms('addPromo')">Korting</button>
                    <button class="action-btn btn-pay" onclick="sendToWinForms('payOnline')">Online Betaling</button>
                `;
            }
        }

        window.addEventListener('DOMContentLoaded', () => { setTimeout(() => { sendToWinForms('ready'); }, 200); });
    </script>
</body>
</html>
