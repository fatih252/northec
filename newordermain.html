<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Northec Touch POS</title>
    <style>
        :root {
            --bg-color: #111827; 
            --surface-color: #1F2937;
            --primary-color: #3B82F6; 
            --primary-active: #2563EB;
            --success-color: #10B981; 
            --success-active: #059669;
            --warning-color: #F59E0B;
            --text-main: #F9FAFB; 
            --text-muted: #9CA3AF; 
            --border-color: #374151; 
            --danger-color: #EF4444;
            --danger-active: #DC2626;

            /* Configurable Font Sizes */
            --category-font-size: 18px;
            --product-font-size: 17px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            border-radius: 0 !important; 
        }

        body { background-color: var(--bg-color); height: 100vh; overflow: hidden; display: flex; color: var(--text-main); }
        .pos-layout { display: flex; width: 100%; height: 100vh; }
        
        /* --- MAIN POS LAYOUT ZONES --- */
        .category-zone { width: 240px; background-color: var(--surface-color); border-right: 2px solid var(--border-color); display: flex; flex-direction: column; overflow-y: auto; scrollbar-width: none; }
        .category-zone::-webkit-scrollbar { display: none; }
        .category-pill { 
            padding: 25px 15px; 
            background-color: var(--surface-color); 
            color: var(--text-main); 
            font-size: var(--category-font-size); 
            font-weight: 800; 
            border-bottom: 2px solid var(--border-color); 
            border-left: 16px solid var(--primary-color); 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            line-height: 1.2; 
            word-wrap: break-word; 
        }
        .category-pill:active { background-color: var(--border-color); }
        .category-pill.active { background-color: var(--bg-color); color: var(--primary-color); }

        .products-zone { flex: 1; display: flex; flex-direction: column; overflow: hidden; background-color: var(--bg-color); }
        .products-area { 
            flex: 1; 
            padding: 20px; 
            overflow-y: auto; 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            grid-auto-rows: clamp(120px, 15vh, 160px); 
            gap: 15px; 
            align-content: start; 
        }
        
        .product-card { 
            background-color: var(--surface-color); 
            padding: 14px 14px 34px 14px; /* Increased bottom padding to prevent overlap with accent bar */
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            height: 100%; 
            cursor: pointer; 
            border: 2px solid var(--border-color); 
            position: relative; 
            overflow: hidden; 
        }
        .product-card:active { border-color: var(--primary-color); background-color: var(--border-color); }
        .product-name { 
            font-size: var(--product-font-size); 
            font-weight: 800; 
            line-height: 1.2; 
            word-wrap: break-word; 
            display: -webkit-box; 
            -webkit-line-clamp: 3; 
            -webkit-box-orient: vertical; 
            overflow: hidden; 
        }
        
        .product-price { 
            font-size: 22px; 
            font-weight: 900; 
            color: var(--text-main); 
            margin-top: auto; 
            text-align: right; 
        }
        
        .color-accent { position: absolute; bottom: 0; left: 0; right: 0; height: 24px; }

        .checkout-zone { width: 450px; background-color: var(--surface-color); border-left: 2px solid var(--border-color); display: flex; flex-direction: column; z-index: 10; height: 100%; }
        .cart-header { padding: 15px 20px; border-bottom: 2px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background-color: var(--bg-color); flex-shrink: 0; }
        .header-title-block { display: flex; align-items: baseline; gap: 10px; }
        .cart-header-title { font-size: 22px; font-weight: 800; }
        .btn-close-app { background-color: var(--danger-color); color: white; border: none; padding: 12px 18px; font-size: 16px; font-weight: 900; cursor: pointer; text-transform: uppercase; }
        .btn-close-app:active { background-color: var(--danger-active); }

        .cart-items { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; background-color: var(--bg-color); }
        .cart-item { background-color: var(--surface-color); border: 2px solid var(--border-color); padding: 15px; display: flex; flex-direction: column; gap: 12px; cursor: pointer; position: relative; }
        .cart-item-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .cart-title { font-size: 20px; font-weight: 900; color: var(--text-main); line-height: 1.2; }
        .cart-details { font-size: 14px; color: var(--text-muted); white-space: pre-line; line-height: 1.4; margin-top: 5px; font-weight: 600; }
        
        .price-block { text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
        .cart-price { font-weight: 900; font-size: 24px; padding: 2px 8px; border-radius: 4px; border: 1px dashed transparent; }
        .cart-price:hover { background-color: rgba(59, 130, 246, 0.2); border-color: var(--primary-color); }
        .cart-original-price { font-size: 16px; color: var(--danger-color); text-decoration: line-through; font-weight: 800; margin-bottom: 2px; }
        .promo-badge { background-color: var(--warning-color); color: #000; font-size: 11px; font-weight: 900; padding: 2px 6px; text-transform: uppercase; margin-top: 4px; display: inline-block; }

        .cart-price-input {
            width: 140px;
            height: 48px;
            background-color: var(--bg-color);
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            font-size: 22px;
            font-weight: 900;
            text-align: right;
            padding: 4px 8px;
            outline: none;
        }
        .cart-price-input:focus {
            border-color: var(--success-color);
            color: var(--success-color);
        }

        .cart-controls { display: flex; align-items: center; justify-content: flex-end; gap: 15px; margin-top: 5px; border-top: 1px dashed var(--border-color); padding-top: 10px; }
        .qty-btn { width: 55px; height: 55px; border: none; font-size: 28px; font-weight: bold; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; background-color: var(--primary-color); }
        .qty-btn:active { background-color: var(--primary-active); }
        .qty-btn.minus { background-color: var(--danger-color); }
        .qty-btn.minus:active { background-color: var(--danger-active); }
        .qty-display { font-size: 22px; font-weight: 900; min-width: 35px; text-align: center; color: var(--text-main); }

        .checkout-panel { padding: 15px; border-top: 2px solid var(--border-color); background-color: var(--surface-color); display: flex; flex-direction: column; gap: 12px; flex-shrink: 0; }
        .type-toggle { display: flex; background-color: var(--bg-color); border: 2px solid var(--border-color); }
        .toggle-btn { flex: 1; padding: 16px 5px; text-align: center; font-size: 15px; font-weight: 800; color: var(--text-muted); cursor: pointer; border-right: 1px solid var(--border-color); }
        .toggle-btn:last-child { border-right: none; }
        .toggle-btn.active { background-color: var(--primary-color); color: white; }
        .comment-input { width: 100%; height: 60px; border: 2px solid var(--border-color); padding: 10px; font-size: 15px; font-weight: 600; resize: none; background-color: var(--bg-color); color: var(--text-main); }
        .comment-input:focus { outline: none; border-color: var(--primary-color); }
        .totals-row { display: flex; justify-content: space-between; align-items: center; font-size: 28px; font-weight: 900; color: var(--text-main); padding: 2px 0; }
        .action-matrix { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-action { width: 100%; border: none; cursor: pointer; color: white; font-weight: 900; text-transform: uppercase; padding: 22px; font-size: 18px; transition: opacity 0.15s ease; }
        .btn-action:active { opacity: 0.8; }
        .btn-action:disabled { opacity: 0.35 !important; cursor: not-allowed !important; pointer-events: none !important; }
        .btn-action.pay { background-color: var(--success-color); }
        .btn-action.pay:active { background-color: var(--success-active); }
        .btn-inchecken { background-color: var(--primary-color); }
        .btn-inchecken:active { background-color: var(--primary-active); }
        .btn-uitchecken { background-color: var(--warning-color); }
        .btn-uitchecken:active { background-color: var(--warning-active); }

        /* --- MODAL OVERLAYS --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(17, 24, 39, 0.90);
            z-index: 9999; display: none; align-items: center; justify-content: center;
        }
        .modal-content { width: 95%; height: 95%; background-color: var(--bg-color); border: 2px solid var(--border-color); display: flex; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        
        .modal-sidebar { width: 300px; background-color: var(--surface-color); border-right: 2px solid var(--border-color); display: flex; flex-direction: column; }
        .prefix-container { display: flex; flex-direction: column; border-bottom: 2px solid var(--border-color); }
        .prefix-btn { padding: 22px 15px; font-size: 20px; font-weight: 900; text-align: center; cursor: pointer; border-bottom: 1px solid var(--border-color); color: var(--text-muted); background-color: var(--bg-color); transition: all 0.1s; }
        .prefix-btn.plus.active { background-color: var(--success-color); color: white; }
        .prefix-btn.minus.active { background-color: var(--danger-color); color: white; }
        .prefix-btn.enkel.active { background-color: var(--warning-color); color: white; }
        .types-list { flex: 1; overflow-y: auto; scrollbar-width: none; }
        .types-list::-webkit-scrollbar { display: none; }
        .type-btn { padding: 22px 15px; font-size: 18px; font-weight: 800; border-bottom: 1px solid var(--border-color); border-left: 6px solid transparent; cursor: pointer; color: var(--text-main); }
        .type-btn:active { background-color: var(--border-color); }
        .type-btn.active { background-color: var(--bg-color); color: var(--primary-color); border-left-color: var(--primary-color); }
        
        .modal-main { flex: 1; display: flex; flex-direction: column; background-color: var(--bg-color); }
        .mod-header-bar { padding: 20px; background-color: var(--surface-color); border-bottom: 2px solid var(--border-color); display: flex; justify-content: center; }
        .mod-product-title { font-size: 28px; font-weight: 900; color: var(--text-main); }
        
        .modifiers-grid { 
            flex: 1; 
            padding: 20px; 
            overflow-y: auto; 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            grid-auto-rows: clamp(100px, 14vh, 140px);
            gap: 15px; 
            align-content: start; 
        }
        .mod-card { 
            background-color: var(--surface-color); 
            border: 2px solid var(--border-color); 
            padding: 16px 14px; 
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            cursor: pointer; 
            position: relative;
            transition: border-color 0.15s ease;
        }
        .mod-card:active { background-color: var(--border-color); border-color: var(--primary-color); }
        .mod-card.selected { border-color: var(--primary-color); background-color: rgba(59, 130, 246, 0.1); }
        .mod-name { font-size: 17px; font-weight: 800; line-height: 1.2; }
        .mod-price { font-size: 18px; font-weight: 800; color: var(--text-muted); text-align: right; }
        
        .modal-cart { width: 400px; background-color: var(--surface-color); border-left: 2px solid var(--border-color); display: flex; flex-direction: column; }
        .mod-cart-items { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background-color: var(--bg-color); }
        .mod-cart-item { background-color: var(--surface-color); border: 2px solid var(--border-color); padding: 12px; display: flex; align-items: center; justify-content: space-between; }
        .mod-cart-item.success .mod-item-name { color: var(--success-color); }
        .mod-cart-item.danger .mod-item-name { color: var(--danger-color); text-decoration: line-through; }
        .mod-item-name { font-size: 17px; font-weight: 800; }
        .mod-item-price { font-size: 19px; font-weight: 800; color: var(--text-muted); }
        .btn-mod-remove { background-color: var(--danger-color); color: white; border: none; width: 42px; height: 42px; font-size: 20px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* --- PRICE OVERRIDE NUMPAD MODAL --- */
        .price-modal-card {
            width: 380px;
            background-color: var(--surface-color);
            border: 2px solid var(--border-color);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .price-header { font-size: 22px; font-weight: 900; text-align: center; color: var(--text-main); }
        .price-display {
            width: 100%;
            height: 60px;
            background-color: var(--bg-color);
            border: 2px solid var(--border-color);
            color: var(--primary-color);
            font-size: 32px;
            font-weight: 900;
            text-align: right;
            padding: 10px 16px;
            outline: none;
        }
        .numpad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .num-btn {
            height: 65px;
            background-color: var(--bg-color);
            border: 2px solid var(--border-color);
            color: var(--text-main);
            font-size: 24px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .num-btn:active { background-color: var(--border-color); border-color: var(--primary-color); }
        .num-btn.danger { background-color: var(--danger-color); color: white; border-color: var(--danger-color); }

        /* --- CUSTOMER CHECKOUT MODAL --- */
        .customer-card {
            width: 680px;
            background-color: var(--surface-color);
            border: 2px solid var(--border-color);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
        }
        .form-row { display: flex; gap: 12px; }
        .form-group { flex: 1; display: flex; flex-direction: column; gap: 6px; }
        .form-label { font-size: 14px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; }
        .form-input {
            width: 100%;
            height: 52px;
            background-color: var(--bg-color);
            border: 2px solid var(--border-color);
            color: var(--text-main);
            font-size: 18px;
            font-weight: 700;
            padding: 0 14px;
            outline: none;
        }
        .form-input:focus { border-color: var(--primary-color); }
        .form-input:read-only { opacity: 0.6; cursor: not-allowed; }

        .payment-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .pay-method-btn {
            height: 85px; 
            background-color: var(--bg-color);
            border: 2px solid var(--border-color);
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px;
            transition: all 0.1s ease;
        }
        .pay-method-btn.active { 
            background-color: var(--primary-color); 
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.4);
        }
        .pay-method-img { max-height: 36px; max-width: 80%; object-fit: contain; pointer-events: none; }
        .pay-method-name { font-size: 13px; font-weight: 900; text-transform: uppercase; text-align: center; line-height: 1.1; }

        .print-options { display: flex; gap: 20px; margin-top: 5px; }
        .checkbox-label { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 800; cursor: pointer; }
        .checkbox-label input { width: 22px; height: 22px; accent-color: var(--primary-color); }

        /* --- TABLE PICKER MODAL --- */
        .table-picker-card {
            width: 750px;
            max-height: 85vh;
            background-color: var(--surface-color);
            border: 2px solid var(--border-color);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
        }
        .table-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            max-height: 45vh;
            overflow-y: auto;
            padding-right: 5px;
        }
        .table-card {
            height: 80px;
            background-color: var(--success-color);
            border: 2px solid var(--success-active);
            color: white;
            font-size: 18px;
            font-weight: 900;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            text-align: center;
            padding: 6px;
        }
        .table-card:active { transform: scale(0.97); }
        .table-card.occupied {
            background-color: var(--danger-color);
            border-color: var(--danger-active);
            cursor: not-allowed;
            opacity: 0.7;
        }
        .table-status-badge { font-size: 10px; font-weight: 800; text-transform: uppercase; background: rgba(0,0,0,0.4); padding: 2px 6px; margin-top: 4px; }
    </style>
</head>
<body>

    <div class="pos-layout">
        <div class="category-zone" id="categoryContainer"></div>
        <div class="products-zone">
            <div class="products-area" id="productsContainer"></div>
        </div>
        <div class="checkout-zone">
            <div class="cart-header">
                <div class="header-title-block">
                    <span class="cart-header-title">BESTELLING</span>
                    <span style="font-size: 16px; color: var(--text-muted);" id="itemCount">0 ITEMS</span>
                </div>
                <button class="btn-close-app" onclick="notifyAction('btnCloseForm')">✖ SLUITEN</button>
            </div>
            <div class="cart-items" id="cartContainer"></div>
            <div class="checkout-panel">
                <div id="standardOptions">
                    <div class="type-toggle" id="masterToggleBlock">
                        <div class="toggle-btn active" id="btnDel" onclick="setOrderType('delivery')">BEZORGEN</div>
                        <div class="toggle-btn" id="btnTak" onclick="setOrderType('takeaway')">AFHALEN</div>
                        <div class="toggle-btn" id="btnTab" onclick="setOrderType('table')">TAFEL</div>
                    </div>
                </div>
                <textarea class="comment-input" id="txtComment" placeholder="Opmerking voor de keuken..." oninput="updateCommentState()"></textarea>
                <div class="totals-row">
                    <span>TOTAAL</span>
                    <span id="lblTotPrice">€ 0.00</span>
                </div>
                <div id="standardSubmit">
                    <button class="btn-action pay" id="btnPay" onclick="submitMasterOrder()" disabled>AFRONDEN & BETALEN</button>
                </div>
                <div id="tableModifyActions" class="action-matrix" style="display: none;">
                    <button class="btn-action btn-inchecken" id="btnInchecken" onclick="notifyAction('btnUpdateOrder')" disabled>INCHECKEN</button>
                    <button class="btn-action btn-uitchecken" id="btnUitchecken" onclick="notifyAction('btnCloseOrder')" disabled>UITCHECKEN</button>
                </div>
            </div>
        </div>
    </div>

    <!-- UNIFIED MODIFIER / DETAIL SPA MODAL -->
    <div class="modal-overlay" id="modifierModal">
        <div class="modal-content">
            <div class="modal-sidebar">
                <button onclick="closeModifierModal()" style="padding: 25px; background: var(--danger-color); color: white; border: none; border-bottom: 2px solid var(--border-color); font-size: 20px; font-weight: 900; width: 100%; cursor: pointer;">✖ ANNULEREN</button>
                <div class="prefix-container">
                    <div class="prefix-btn plus active" onclick="setPrefix('+')">+ EXTRA</div>
                    <div class="prefix-btn minus" onclick="setPrefix('-')">- ZONDER</div>
                    <div class="prefix-btn enkel" onclick="setPrefix('> enkel')">ENKEL</div>
                </div>
                <div class="types-list" id="modalTypesContainer"></div>
            </div>
            
            <div class="modal-main">
                <div class="mod-header-bar">
                    <div class="mod-product-title" id="lblModalProductTitle">Laden...</div>
                </div>
                <div class="modifiers-grid" id="modalModifiersContainer"></div>
            </div>

            <div class="modal-cart">
                <div class="mod-cart-items" id="modalSubCartContainer"></div>
                <div class="checkout-panel" style="border-top: none;">
                    <div class="totals-row">
                        <span>TOTAAL</span>
                        <span id="lblModalTotalPrice">€ 0.00</span>
                    </div>
                    <button class="btn-action pay" id="btnModalSubmit" onclick="submitModal()">VOEG TOE</button>
                </div>
            </div>
        </div>
    </div>

    <!-- PRICE OVERRIDE NUMPAD MODAL -->
    <div class="modal-overlay" id="priceModal">
        <div class="price-modal-card">
            <div class="price-header">BEDRAG WIJZIGEN</div>
            <input type="text" class="price-display" id="txtOverridePrice" readonly value="0.00" />
            <div class="numpad-grid">
                <button class="num-btn" onclick="appendNum('1')">1</button>
                <button class="num-btn" onclick="appendNum('2')">2</button>
                <button class="num-btn" onclick="appendNum('3')">3</button>
                <button class="num-btn" onclick="appendNum('4')">4</button>
                <button class="num-btn" onclick="appendNum('5')">5</button>
                <button class="num-btn" onclick="appendNum('6')">6</button>
                <button class="num-btn" onclick="appendNum('7')">7</button>
                <button class="num-btn" onclick="appendNum('8')">8</button>
                <button class="num-btn" onclick="appendNum('9')">9</button>
                <button class="num-btn" onclick="appendNum('.')">.</button>
                <button class="num-btn" onclick="appendNum('0')">0</button>
                <button class="num-btn danger" onclick="clearNum()">⌫</button>
            </div>
            <div class="price-actions">
                <button class="btn-action" style="background: var(--border-color);" onclick="closePriceModal()">ANNULEREN</button>
                <button class="btn-action pay" onclick="confirmPriceOverride()">OPSLAAN</button>
            </div>
        </div>
    </div>

    <!-- INTEGRATED CUSTOMER CHECKOUT MODAL -->
    <div class="modal-overlay" id="customerModal">
        <div class="customer-card">
            <div class="price-header">KLANT & AFREKENEN</div>
            
            <div class="form-row" id="phoneRow">
                <div class="form-group">
                    <label class="form-label">Telefoonnummer</label>
                    <input type="text" class="form-input" id="custPhone" placeholder="04..." oninput="onPhoneInput()" />
                </div>
            </div>

            <div class="form-row" id="addressRow1">
                <div class="form-group">
                    <label class="form-label">Voornaam</label>
                    <input type="text" class="form-input" id="custFirstName" placeholder="Voornaam" />
                </div>
                <div class="form-group">
                    <label class="form-label">Achternaam</label>
                    <input type="text" class="form-input" id="custLastName" placeholder="Achternaam" />
                </div>
            </div>

            <div class="form-row" id="addressRow2">
                <div class="form-group" style="flex: 2;">
                    <label class="form-label">Straat</label>
                    <input type="text" class="form-input" id="custStreet" list="streetSuggestions" placeholder="Straatnaam" oninput="validateCustomerForm()" />
                    <datalist id="streetSuggestions"></datalist>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label class="form-label">Huisnr</label>
                    <input type="text" class="form-input" id="custHouseNr" placeholder="Nr" oninput="validateCustomerForm()" />
                </div>
            </div>

            <div class="form-row" id="addressRow3">
                <div class="form-group">
                    <label class="form-label">Gemeente / Zone</label>
                    <select class="form-input" id="custZoneSelect" onchange="onZoneSelectChange()"></select>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Betaalmethode</label>
                <div class="payment-grid" id="paymentMethodsGrid"></div>
            </div>

            <div class="print-options">
                <label class="checkbox-label"><input type="checkbox" id="chkPosPrint" checked /> Kassabon Printen</label>
                <label class="checkbox-label"><input type="checkbox" id="chkKitchenPrint" checked /> Keukenbon Printen</label>
            </div>

            <div class="price-actions">
                <button class="btn-action" style="background: var(--border-color);" onclick="closeCustomerModal()">ANNULEREN</button>
                <button class="btn-action pay" id="btnConfirmCustomer" onclick="confirmCustomerCheckout()">AFRONDEN (F8)</button>
            </div>
        </div>
    </div>

    <!-- TABLE PICKER MODAL -->
    <div class="modal-overlay" id="tableModal">
        <div class="table-picker-card">
            <div class="price-header">TAFEL SELECTEREN</div>
            
            <div class="form-group">
                <label class="form-label">Betaalmethode</label>
                <div class="payment-grid" id="tablePaymentGrid"></div>
            </div>

            <div class="form-group">
                <label class="form-label">Beschikbare Tafels</label>
                <div class="table-grid" id="tableGrid"></div>
            </div>

            <div class="price-actions">
                <button class="btn-action" style="background: var(--border-color);" onclick="closeTableModal()">ANNULEREN</button>
            </div>
        </div>
    </div>

    <script>
        let currentCart = [];
        let currentOrderType = 'delivery'; 
        let isTableMode = false;
        
        /* Modal Modifier SPA State */
        let currentPrefix = '+';
        let isEditingCartItem = false;
        let activeEditingLineId = null;

        /* Price Override State */
        let editingLineId = null;
        let isNewNumInput = true;

        /* Customer & Table Modal State */
        let selectedPaymentMethodId = 1;
        let selectedTablePaymentMethodId = 1;
        let deliveryZonesList = [];

        document.addEventListener("DOMContentLoaded", () => {
            sendHostMessage({ action: "ui_ready" });
        });

        function sendHostMessage(payload) {
            if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage(payload);
        }

        /* Dynamic Font Size Setter (Incoming as px) */
        window.applyFontSettings = function(categorySize, productSize) {
            if (categorySize && categorySize > 0) {
                document.documentElement.style.setProperty('--category-font-size', categorySize + 'px');
            }
            if (productSize && productSize > 0) {
                document.documentElement.style.setProperty('--product-font-size', productSize + 'px');
            }
        };

        window.setPosMode = function(isExistingTable) {
            isTableMode = isExistingTable;
            if (isExistingTable) {
                document.getElementById('standardOptions').style.display = 'none';
                document.getElementById('standardSubmit').style.display = 'none';
                document.getElementById('tableModifyActions').style.display = 'grid';
            } else {
                document.getElementById('standardOptions').style.display = 'block';
                document.getElementById('standardSubmit').style.display = 'block';
                document.getElementById('tableModifyActions').style.display = 'none';
            }
        };

        window.lockExternalOrder = function() {
            const toggleContainer = document.getElementById('masterToggleBlock');
            if (toggleContainer) {
                toggleContainer.style.opacity = "0.5";
                toggleContainer.style.pointerEvents = "none";
            }
        };

        window.renderCategories = function(categories) {
            const container = document.getElementById("categoryContainer");
            container.innerHTML = "";
            categories.forEach(cat => {
                const btn = document.createElement("div");
                btn.className = "category-pill";
                btn.id = "cat_" + cat.id;
                btn.innerText = cat.name.toUpperCase();

                const hexColor = (cat.color && cat.color !== "#000000") ? cat.color : "var(--primary-color)";
                btn.style.borderLeftColor = hexColor;

                btn.onclick = () => {
                    document.querySelectorAll('.category-pill').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    sendHostMessage({ action: "get_products", mainProductId: parseInt(cat.id) });
                };
                container.appendChild(btn);
            });
            if (categories.length > 0) document.getElementById("cat_" + categories[0].id).click();
        };

        window.renderProducts = function(products) {
            const container = document.getElementById("productsContainer");
            container.innerHTML = "";
            products.forEach(prod => {
                const card = document.createElement("div");
                card.className = "product-card";
                const hexColor = prod.color ? prod.color : "var(--primary-color)";
                card.innerHTML = `
                    <div class="product-name">${prod.name}</div>
                    <div class="product-price">€ ${parseFloat(prod.pos_value).toFixed(2)}</div>
                    <div class="color-accent" style="background-color: ${hexColor}"></div>
                `;
                card.onclick = () => sendHostMessage({ action: "product_clicked", product: prod });
                container.appendChild(card);
            });
        };

        window.addProductToCart = function(product) {
            const existingItem = currentCart.find(item => item.lineId === product.lineId);
            if (existingItem) {
                existingItem.amount += 1;
                if (existingItem.action !== 'I') existingItem.action = 'U';
            } else {
                currentCart.push(product);
            }
            renderCartUI();
            syncCartToHost();
        };

        window.loadExistingOrder = function(cartItems, existingComment) {
            currentCart = cartItems || [];
            document.getElementById("txtComment").value = existingComment || "";
            renderCartUI();
        };

        window.updateTotalsDisplay = function(totalString) {
            document.getElementById("lblTotPrice").innerText = "€ " + totalString;
        };

        function renderCartUI() {
            const container = document.getElementById("cartContainer");
            container.innerHTML = "";
            let activeItemCount = 0;

            currentCart.forEach(item => {
                if (item.action === 'D') return; 
                activeItemCount += item.amount;

                let subDetails = "";
                if (item.productOptionList) item.productOptionList.forEach(o => subDetails += `${o.prefix || ''} ${o.name}\n`);
                if (item.extraList) item.extraList.forEach(e => subDetails += `${e.prefix || '+'} ${e.name}\n`);
                if (item.productExtraList) item.productExtraList.forEach(pe => subDetails += `${pe.prefix || '+'} ${pe.name}\n`);
                if (item.comment) subDetails += `📝 ${item.comment}\n`;

                const row = document.createElement("div");
                row.className = "cart-item";
                
                row.ondblclick = (e) => {
                    if (e.target.classList.contains('qty-btn') || e.target.classList.contains('cart-price') || e.target.classList.contains('cart-price-input')) return;
                    sendHostMessage({ action: "edit_cart_item", lineId: item.lineId });
                };

                const baseUnitPrice = item.originalPrice ? item.originalPrice : (item.value ? item.value : item.pos_value);
                const isDiscounted = (item.lineTotal < baseUnitPrice - 0.001);
                
                const originalTotal = baseUnitPrice * item.amount;
                const currentTotal = item.lineTotal * item.amount;

                const isEditable = (
                    item.value_editable === true || item.value_editable === 1 || item.value_editable === "true" ||
                    item.valueEditable === true || item.valueEditable === 1 || item.valueEditable === "true"
                );

                let priceDisplayHtml = '';
                if (isEditable) {
                    priceDisplayHtml = `
                        <input type="number" step="0.01" class="cart-price-input" 
                               value="${parseFloat(item.lineTotal || 0).toFixed(2)}" 
                               onclick="event.stopPropagation()"
                               onfocus="this.select()"
                               onchange="onCartPriceInputChange('${item.lineId}', this.value)" />
                    `;
                } else {
                    priceDisplayHtml = `
                        ${isDiscounted ? `<div class="cart-original-price">€ ${originalTotal.toFixed(2)}</div>` : ''}
                        <div class="cart-price" style="${isDiscounted ? 'color: var(--danger-color); font-weight: 900;' : ''}" ondblclick="event.stopPropagation(); overridePrice('${item.lineId}', ${item.lineTotal})">€ ${currentTotal.toFixed(2)}</div>
                    `;
                }

                row.innerHTML = `
                    <div class="cart-item-top">
                        <div style="flex: 1; padding-right: 10px;">
                            <div class="cart-title">${item.mainProductName ? '['+item.mainProductName.toUpperCase()+'] ' : ''}${item.name}</div>
                            ${subDetails ? `<div class="cart-details">${subDetails.trim()}</div>` : ''}
                            ${item.discount ? `<span class="promo-badge">${item.discount.type ? item.discount.type.toUpperCase() : ''} KORTING</span>` : (isDiscounted ? `<span class="promo-badge">PROMO</span>` : '')}
                        </div>
                        <div class="price-block">
                            ${priceDisplayHtml}
                        </div>
                    </div>
                    <div class="cart-controls">
                        <button class="qty-btn minus" onclick="event.stopPropagation(); adjustQuantity('${item.lineId}', -1)">-</button>
                        <span class="qty-display">${item.amount}</span>
                        <button class="qty-btn" onclick="event.stopPropagation(); adjustQuantity('${item.lineId}', 1)">+</button>
                    </div>
                `;
                container.appendChild(row);
            });

            document.getElementById("itemCount").innerText = `${activeItemCount} ITEMS`;
            
            const hasItems = activeItemCount > 0;
            document.getElementById("btnPay").disabled = !hasItems;
            document.getElementById("btnInchecken").disabled = !hasItems;
            document.getElementById("btnUitchecken").disabled = !hasItems;

            container.scrollTop = container.scrollHeight;
        }

        function onCartPriceInputChange(lineId, newPriceVal) {
            const val = parseFloat(newPriceVal);
            if (!isNaN(val) && val >= 0) {
                const item = currentCart.find(i => i.lineId === lineId);
                if (item) {
                    item.lineTotal = val;
                    item.priceModified = true;
                    if (item.action !== 'I' && item.orderDetailId !== 0) item.action = 'U';
                    renderCartUI();
                    syncCartToHost();
                }
            }
        }

        /* --- PRICE OVERRIDE NUMPAD LOGIC --- */
        function overridePrice(lineId, currentPrice) {
            editingLineId = lineId;
            isNewNumInput = true;
            document.getElementById('txtOverridePrice').value = parseFloat(currentPrice).toFixed(2);
            document.getElementById('priceModal').style.display = 'flex';
        }

        function closePriceModal() {
            document.getElementById('priceModal').style.display = 'none';
            editingLineId = null;
        }

        function appendNum(num) {
            const display = document.getElementById('txtOverridePrice');
            if (isNewNumInput) {
                display.value = num === '.' ? '0.' : num;
                isNewNumInput = false;
            } else {
                if (num === '.' && display.value.includes('.')) return;
                display.value += num;
            }
        }

        function clearNum() {
            const display = document.getElementById('txtOverridePrice');
            if (display.value.length > 1) {
                display.value = display.value.slice(0, -1);
            } else {
                display.value = '0.00';
                isNewNumInput = true;
            }
        }

        function confirmPriceOverride() {
            if (!editingLineId) return;
            const val = parseFloat(document.getElementById('txtOverridePrice').value);
            if (!isNaN(val) && val >= 0) {
                const item = currentCart.find(i => i.lineId === editingLineId);
                if (item) {
                    item.lineTotal = val;
                    item.priceModified = true;
                    if (item.action !== 'I' && item.orderDetailId !== 0) item.action = 'U';
                    renderCartUI();
                    syncCartToHost();
                }
            }
            closePriceModal();
        }

        /* --- CUSTOMER CHECKOUT MODAL LOGIC --- */
        window.openCustomerModal = function(dataPayload) {
            let data = dataPayload;
            if (typeof dataPayload === 'string') {
                try { data = JSON.parse(dataPayload); } catch(e) { data = {}; }
            }
            data = data || {};

            deliveryZonesList = data.zones || [];
            const select = document.getElementById('custZoneSelect');
            if (select) {
                select.innerHTML = '';
                deliveryZonesList.forEach(z => {
                    const opt = document.createElement('option');
                    opt.value = z.postalcode || '';
                    opt.innerText = `${z.name || ''} (${z.postalcode || ''})`;
                    if (z.isDefault) opt.selected = true;
                    select.appendChild(opt);
                });
            }

            const payGrid = document.getElementById('paymentMethodsGrid');
            if (payGrid) {
                payGrid.innerHTML = '';
                const pMethods = data.paymentMethods || [];
                selectedPaymentMethodId = data.defaultPaymentId || (pMethods.length > 0 ? pMethods[0].id : 1);

                pMethods.forEach(pm => {
                    const btn = document.createElement('div');
                    btn.className = `pay-method-btn ${pm.id === selectedPaymentMethodId ? 'active' : ''}`;
                    
                    let html = '';
                    if (pm.image) {
                        html += `<img src="${pm.image}" alt="${pm.name}" class="pay-method-img" />`;
                    }
                    html += `<span class="pay-method-name">${pm.name || 'Contant'}</span>`;
                    
                    btn.innerHTML = html;
                    btn.onclick = () => {
                        selectedPaymentMethodId = pm.id;
                        document.querySelectorAll('.pay-method-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                    };
                    payGrid.appendChild(btn);
                });
            }

            const isTakeaway = currentOrderType === 'takeaway';
            const isTable = currentOrderType === 'table';

            document.getElementById('phoneRow').style.display = isTable ? 'none' : 'flex';
            document.getElementById('addressRow1').style.display = (isTakeaway || isTable) ? 'none' : 'flex';
            document.getElementById('addressRow2').style.display = (isTakeaway || isTable) ? 'none' : 'flex';
            document.getElementById('addressRow3').style.display = (isTakeaway || isTable) ? 'none' : 'flex';

            const phoneInput = document.getElementById('custPhone');
            if (phoneInput) {
                phoneInput.readOnly = !!data.phoneReadOnly;
                if (data.phoneNr) phoneInput.value = data.phoneNr;
            }

            if (isTakeaway && data.shopStreet) {
                document.getElementById('custStreet').value = data.shopStreet || '';
                document.getElementById('custHouseNr').value = data.shopHouseNr || '';
            }

            if (select && select.value) {
                loadStreetSuggestions(select.value);
            }

            validateCustomerForm();
            document.getElementById('customerModal').style.display = 'flex';
        };

        window.populateClientData = function(client) {
            if (client) {
                if (document.getElementById('custPhone')) document.getElementById('custPhone').value = client.phone_no || '';
                if (document.getElementById('custFirstName')) document.getElementById('custFirstName').value = client.first_name || '';
                if (document.getElementById('custLastName')) document.getElementById('custLastName').value = client.last_name || '';
                if (document.getElementById('custStreet')) document.getElementById('custStreet').value = client.street || '';
                if (document.getElementById('custHouseNr')) document.getElementById('custHouseNr').value = client.hous_no || '';
                if (client.postal_code && document.getElementById('custZoneSelect')) {
                    document.getElementById('custZoneSelect').value = client.postal_code;
                    loadStreetSuggestions(client.postal_code);
                }
                validateCustomerForm();
            }
        };

        async function loadStreetSuggestions(postalcode) {
            if (!postalcode) return;
            try {
                const res = await fetch(`https://www.schoolvoorbeeld.be/geocrowl/streets.php?postalcode=${postalcode}&street=&city=&search=1&output=json`);
                if (res.ok) {
                    const streets = await res.json();
                    const datalist = document.getElementById('streetSuggestions');
                    if (datalist) {
                        datalist.innerHTML = '';
                        streets.forEach(s => {
                            const opt = document.createElement('option');
                            opt.value = s;
                            datalist.appendChild(opt);
                        });
                    }
                }
            } catch(e) {}
        }

        function onZoneSelectChange() {
            const select = document.getElementById('custZoneSelect');
            if (select) loadStreetSuggestions(select.value);
            validateCustomerForm();
        }

        function onPhoneInput() {
            const phone = document.getElementById('custPhone').value;
            if (phone.length >= 8) {
                sendHostMessage({ action: "customer_lookup", phone: phone });
            }
        }

        function validateCustomerForm() {
            const btn = document.getElementById('btnConfirmCustomer');
            if (!btn) return;

            if (currentOrderType === 'delivery') {
                const street = document.getElementById('custStreet').value.trim();
                const houseNr = document.getElementById('custHouseNr').value.trim();
                btn.disabled = !(street.length > 0 && houseNr.length > 0);
            } else {
                btn.disabled = false;
            }
        }

        function closeCustomerModal() {
            document.getElementById('customerModal').style.display = 'none';
        }

        function confirmCustomerCheckout() {
            const payload = {
                phone: document.getElementById('custPhone').value,
                firstName: document.getElementById('custFirstName').value,
                lastName: document.getElementById('custLastName').value,
                street: document.getElementById('custStreet').value,
                houseNr: document.getElementById('custHouseNr').value,
                postalCode: document.getElementById('custZoneSelect') ? document.getElementById('custZoneSelect').value : '',
                paymentMethodId: selectedPaymentMethodId,
                posPrint: document.getElementById('chkPosPrint') ? document.getElementById('chkPosPrint').checked : true,
                kitchenPrint: document.getElementById('chkKitchenPrint') ? document.getElementById('chkKitchenPrint').checked : true
            };
            sendHostMessage({ action: "customer_submit", data: payload });
            closeCustomerModal();
        }

        /* --- TABLE PICKER MODAL LOGIC --- */
        window.openTableModal = function(dataPayload) {
            let data = dataPayload;
            if (typeof dataPayload === 'string') {
                try { data = JSON.parse(dataPayload); } catch(e) { data = {}; }
            }
            data = data || {};

            const payGrid = document.getElementById('tablePaymentGrid');
            if (payGrid) {
                payGrid.innerHTML = '';
                const pMethods = data.paymentMethods || [];
                selectedTablePaymentMethodId = data.defaultPaymentId || (pMethods.length > 0 ? pMethods[0].id : 1);

                pMethods.forEach(pm => {
                    const btn = document.createElement('div');
                    btn.className = `pay-method-btn ${pm.id === selectedTablePaymentMethodId ? 'active' : ''}`;
                    let html = '';
                    if (pm.image) {
                        html += `<img src="${pm.image}" alt="${pm.name}" class="pay-method-img" />`;
                    }
                    html += `<span class="pay-method-name">${pm.name || 'Contant'}</span>`;
                    btn.innerHTML = html;
                    btn.onclick = () => {
                        selectedTablePaymentMethodId = pm.id;
                        document.querySelectorAll('#tablePaymentGrid .pay-method-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                    };
                    payGrid.appendChild(btn);
                });
            }

            const tableGrid = document.getElementById('tableGrid');
            if (tableGrid) {
                tableGrid.innerHTML = '';
                const tables = data.tables || [];
                tables.forEach(t => {
                    const card = document.createElement('div');
                    card.className = `table-card ${t.isOccupied ? 'occupied' : ''}`;
                    card.innerHTML = `
                        <div>${t.name}</div>
                        ${t.isOccupied ? '<div class="table-status-badge">BEZET</div>' : ''}
                    `;
                    card.onclick = () => {
                        if (t.isOccupied) {
                            alert("Tafel is reeds in gebruik");
                            return;
                        }
                        sendHostMessage({
                            action: "table_submit",
                            tableId: t.id,
                            paymentMethodId: selectedTablePaymentMethodId
                        });
                        closeTableModal();
                    };
                    tableGrid.appendChild(card);
                });
            }

            document.getElementById('tableModal').style.display = 'flex';
        };

        function closeTableModal() {
            document.getElementById('tableModal').style.display = 'none';
        }

        function adjustQuantity(lineId, direction) {
            const item = currentCart.find(i => i.lineId === lineId);
            if (!item) return;
            if (direction > 0) {
                item.amount += 1;
                if (item.action !== 'I') item.action = 'U';
            } else {
                if (item.amount > 1) {
                    item.amount -= 1;
                    if (item.action !== 'I') item.action = 'U';
                } else {
                    if (item.orderDetailId !== 0) item.action = 'D'; 
                    else currentCart = currentCart.filter(i => i.lineId !== lineId);
                }
            }
            renderCartUI();
            syncCartToHost();
        }

        function setOrderType(type) {
            if (isTableMode) return; 
            currentOrderType = type;
            document.getElementById("btnDel").classList.toggle("active", type === 'delivery');
            document.getElementById("btnTak").classList.toggle("active", type === 'takeaway');
            document.getElementById("btnTab").classList.toggle("active", type === 'table');
            sendHostMessage({ action: "set_delivery_type", type: type });
        }

        function submitMasterOrder() {
            const activeItems = currentCart.filter(i => i.action !== 'D');
            if (activeItems.length === 0) return;
            
            if (currentOrderType === 'table') sendHostMessage({ action: "open_table_picker" });
            else sendHostMessage({ action: "open_customer_checkout" });
        }

        function updateCommentState() { sendHostMessage({ action: "sync_comment", value: document.getElementById("txtComment").value }); }
        function syncCartToHost() { sendHostMessage({ action: "sync_cart", cart: currentCart }); }
        function notifyAction(actionId) { sendHostMessage({ action: "trigger_action", id: actionId }); }

        /* --- UNIFIED PRODUCT MODIFIER SPA MODAL LOGIC --- */
        window.openModifierModal = function(isEdit, lineId) { 
            isEditingCartItem = !!isEdit;
            activeEditingLineId = lineId || null;

            const submitBtn = document.getElementById('btnModalSubmit');
            if (submitBtn) {
                submitBtn.innerText = isEditingCartItem ? "WIJZIGEN" : "VOEG TOE";
            }

            document.getElementById('modifierModal').style.display = 'flex'; 
            setPrefix('+'); 
        };

        window.closeModifierModal = function() { 
            document.getElementById('modifierModal').style.display = 'none'; 
            isEditingCartItem = false;
            activeEditingLineId = null;
        };
        
        window.initProduct = function(data) { 
            document.getElementById('lblModalProductTitle').innerText = data.productName.toUpperCase(); 
        };

        window.renderModalTypes = function(types) {
            const container = document.getElementById("modalTypesContainer");
            container.innerHTML = "";
            types.forEach(t => {
                const btn = document.createElement("div");
                btn.className = "type-btn";
                btn.id = "type_" + t.id;
                btn.innerText = t.name;
                btn.onclick = () => {
                    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    sendHostMessage({ action: "modal_load_type_items", typeId: t.id, isProductExtra: t.isProductExtra });
                };
                container.appendChild(btn);
            });
            if (types.length > 0) document.getElementById("type_" + types[0].id).click();
        };

        window.renderModalModifiers = function(items, isProductExtra) {
            const container = document.getElementById("modalModifiersContainer");
            container.innerHTML = "";
            items.forEach(item => {
                const card = document.createElement("div");
                card.className = "mod-card";
                card.innerHTML = `<div class="mod-name">${item.name}</div><div class="mod-price">+ € ${item.price.toFixed(2)}</div>`;
                card.onclick = () => {
                    sendHostMessage({ action: "modal_add_modifier", isProductExtra: isProductExtra, prefix: currentPrefix, rawData: item.rawData });
                };
                container.appendChild(card);
            });
        };

        window.renderSubCart = function(data) {
            document.getElementById('lblModalTotalPrice').innerText = "€ " + data.total.toFixed(2);
            const container = document.getElementById("modalSubCartContainer");
            container.innerHTML = "";
            data.items.forEach(item => {
                const row = document.createElement("div");
                row.className = `mod-cart-item ${item.color}`;
                row.innerHTML = `
                    <div><div class="mod-item-name">${item.displayName}</div><div class="mod-item-price">€ ${item.price.toFixed(2)}</div></div>
                    <button class="btn-mod-remove" onclick="removeModifier(${item.uniqueId}, ${item.isProductExtra})">X</button>
                `;
                container.appendChild(row);
            });
            container.scrollTop = container.scrollHeight;
        };

        function setPrefix(prefix) {
            currentPrefix = prefix;
            document.querySelectorAll('.prefix-btn').forEach(b => b.classList.remove('active'));
            if(prefix === '+') document.querySelector('.prefix-btn.plus').classList.add('active');
            if(prefix === '-') document.querySelector('.prefix-btn.minus').classList.add('active');
            if(prefix === '> enkel') document.querySelector('.prefix-btn.enkel').classList.add('active');
        }

        function removeModifier(uniqueId, isProductExtra) { 
            sendHostMessage({ action: "modal_remove_modifier", uniqueId: uniqueId, isProductExtra: isProductExtra }); 
        }

        function submitModal() { sendHostMessage({ action: "modal_submit" }); }

        window.addEventListener('keydown', function(e) {
            if (document.getElementById('tableModal').style.display === 'flex') {
                if (e.key === 'Escape') { e.preventDefault(); closeTableModal(); }
            } else if (document.getElementById('customerModal').style.display === 'flex') {
                if (e.key === 'Escape') { e.preventDefault(); closeCustomerModal(); }
                if (e.key === 'F8') { e.preventDefault(); confirmCustomerCheckout(); }
            } else if (document.getElementById('priceModal').style.display === 'flex') {
                if (e.key === 'Escape') { e.preventDefault(); closePriceModal(); }
                if (e.key === 'Enter') { e.preventDefault(); confirmPriceOverride(); }
            } else if (document.getElementById('modifierModal').style.display === 'flex') {
                if (e.key === 'Escape') { e.preventDefault(); closeModifierModal(); }
            } else {
                if (e.key === 'F6') { e.preventDefault(); setOrderType('table'); }
                if (e.key === 'F7') { e.preventDefault(); setOrderType('takeaway'); }
                if (e.key === 'F8') { e.preventDefault(); setOrderType('delivery'); }
                if (e.key === 'Escape') { e.preventDefault(); notifyAction('btnCloseForm'); }
            }
        });
    </script>
</body>
</html>
