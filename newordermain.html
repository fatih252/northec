<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POS Touchscreen Ordering Console</title>
    <style>
        :root {
            --bg-base: #0f172a;
            --bg-panel: #1e293b;
            --bg-card: #334155;
            --border-color: #475569;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            
            --brand-primary: #3b82f6;
            --brand-success: #10b981;
            --brand-danger: #ef4444;
            --brand-warning: #f59e0b;
        }

        /* --- DASHBOARD UI OVERRIDE ZOOM LOCKDOWN --- */
        * { 
            -webkit-tap-highlight-color: transparent; 
            box-sizing: border-box; 
            user-select: none; 
            -webkit-user-select: none;
            margin: 0; 
            padding: 0; 
            touch-action: none; /* Stops dual-tap or pinch zooming behaviors */
        }
        
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            font-family: 'Segoe UI', -apple-system, Tahoma, sans-serif; 
            background-color: var(--bg-base); 
            color: var(--text-main); 
            overscroll-behavior: none;
        }

        #app-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        /* --- TOP HEADER BAR --- */
        #top-header {
            height: 65px;
            background-color: var(--bg-panel);
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            flex-shrink: 0;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .header-title { font-size: 20px; font-weight: 800; letter-spacing: 0.5px; }

        .btn-close {
            background-color: transparent;
            color: var(--text-main);
            border: 2px solid var(--border-color);
            padding: 0 20px;
            height: 46px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.1s ease;
        }
        .btn-close:active { background-color: var(--brand-danger); border-color: var(--brand-danger); transform: scale(0.95); }

        /* --- MAIN POS LAYOUT --- */
        #pos-layout { 
            display: flex; 
            flex: 1; 
            overflow: hidden; 
        }

        /* --- LEFT: Categories Column --- */
        #col-categories {
            width: 240px;
            background-color: var(--bg-panel);
            border-right: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 10px;
            gap: 8px;
        }
        
        .cat-btn {
            min-height: 60px;
            padding: 0 15px;
            background: var(--bg-base);
            color: var(--text-main);
            border: 2px solid transparent;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: all 0.1s ease;
        }
        .cat-btn.active { 
            background-color: var(--brand-primary); 
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.4);
        }
        .cat-btn:active { transform: scale(0.96); }

        /* --- CENTER: Products Grid --- */
        #col-products {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            align-content: start;
            background-color: var(--bg-base);
        }

        .prod-btn {
            background-color: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        }
        .prod-btn:active { 
            transform: scale(0.94); 
            background-color: var(--brand-primary);
            border-color: var(--brand-primary); 
        }
        .prod-name { font-weight: 800; font-size: 14px; margin-bottom: 6px; line-height: 1.2; }
        .prod-price { font-weight: 700; color: #6ee7b7; font-size: 13px; background: rgba(0,0,0,0.25); padding: 3px 8px; border-radius: 20px; }

        /* --- RIGHT: Shopping Cart --- */
        #col-cart {
            width: 390px;
            background-color: var(--bg-panel);
            border-left: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            box-shadow: -4px 0 15px rgba(0,0,0,0.2);
        }

        #cart-list { 
            flex: 1; 
            overflow-y: auto; 
            padding: 12px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
        }
        
        .cart-item {
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .cart-item-header { display: flex; justify-content: space-between; align-items: flex-start; cursor: pointer; }
        .cart-item-title { font-weight: 800; font-size: 14px; color: var(--text-main); }
        .cart-item-price { font-weight: 900; color: var(--brand-success); font-size: 15px; }
        .cart-item-options { font-size: 12px; color: var(--text-muted); line-height: 1.4; white-space: pre-wrap; }
        
        .cart-controls { display: flex; gap: 6px; margin-top: 2px; }
        .ctrl-btn { 
            flex: 1; 
            background: var(--bg-card); 
            border: 1px solid var(--border-color); 
            color: white; 
            height: 44px; 
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 22px; 
            cursor: pointer; 
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .ctrl-btn:active { background: #475569; transform: scale(0.95); }
        .ctrl-btn.btn-delete { background: var(--brand-danger); border-color: var(--brand-danger); font-size: 16px; }

        /* --- Cart Footer / Actions --- */
        #cart-footer { 
            padding: 16px; 
            background: #0b0f19; 
            border-top: 2px solid var(--border-color); 
        }
        
        .totals-row { 
            display: flex; 
            justify-content: space-between; 
            font-size: 26px; 
            font-weight: 900; 
            margin-bottom: 16px; 
            color: var(--brand-success); 
            align-items: center;
        }
        .totals-label { color: var(--text-main); font-size: 18px; }
        
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .action-btn { 
            height: 56px; 
            font-size: 14px; 
            font-weight: 800; 
            border: none; 
            border-radius: 8px; 
            color: white; 
            cursor: pointer; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }
        .action-btn:active { transform: scale(0.96); }
        
        .btn-pay { grid-column: span 2; background-color: var(--brand-success); height: 70px; font-size: 17px; }
        .btn-table { background-color: var(--brand-primary); }
        .btn-takeaway { background-color: var(--brand-warning); }
        .btn-delivery { background-color: var(--brand-danger); }
        .btn-discount { background-color: var(--border-color); }

        @media (max-width: 1024px) {
            #col-categories { width: 190px; }
            #col-cart { width: 320px; }
            .pos-btn { height: 44px; font-size: 13px; }
        }
    </style>
</head>
<body>

    <div id="app-wrapper">
        <header id="top-header">
            <div class="header-title" id="lbl-order-title">Nieuwe Bestelling</div>
            <button class="btn-close" onclick="sendToWinForms('closeForm')">✕ Sluiten</button>
        </header>

        <div id="pos-layout">
            <div id="col-categories"></div>
            <div id="col-products"></div>
            
            <div id="col-cart">
                <div id="cart-list"></div>
                <div id="cart-footer">
                    <div class="totals-row">
                        <span class="totals-label">Totaal</span>
                        <span id="cart-total">€ 0.00</span>
                    </div>
                    <div class="action-grid" id="action-buttons"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Zoom lockdown listeners matching main dashboard layout hooks
        window.addEventListener('dragstart', (e) => e.preventDefault());
        window.addEventListener('drop', (e) => e.preventDefault());
        window.addEventListener('wheel', (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
        window.addEventListener('keydown', (e) => {
            if (e.ctrlKey && ['+', '-', '=', '0'].includes(e.key)) e.preventDefault();
        });

        function sendToWinForms(action, payload) {
            let data = payload || {};
            data.action = action;
            if (window.chrome && window.chrome.webview) {
                // Securely stringify objects to avoid type boundary crashes
                window.chrome.webview.postMessage(JSON.stringify(data));
            }
        }

        function updateUI(payload) {
            if (payload.Categories) renderCategories(payload.Categories);
            if (payload.Products) renderProducts(payload.Products);
            if (payload.Cart) renderCart(payload.Cart, payload.Total);
            
            if (payload.OrderState !== undefined) {
                renderActionButtons(payload.OrderState);
            }
            if (payload.OrderIdTitle) {
                document.getElementById('lbl-order-title').innerText = payload.OrderIdTitle;
            }
        }

        function renderCategories(cats) {
            const container = document.getElementById('col-categories');
            container.innerHTML = '';
            cats.forEach(c => {
                const btn = document.createElement('button');
                btn.className = `cat-btn ${c.IsActive ? 'active' : ''}`;
                if(c.Color) {
                    if(c.IsActive) btn.style.backgroundColor = c.Color;
                    else btn.style.borderLeft = `6px solid ${c.Color}`;
                }
                btn.innerText = c.Name;
                btn.onclick = () => sendToWinForms('categoryClicked', { id: c.Id });
                container.appendChild(btn);
            });
        }

        function renderProducts(prods) {
            const container = document.getElementById('col-products');
            container.innerHTML = '';
            prods.forEach(p => {
                const btn = document.createElement('div');
                btn.className = 'prod-btn';
                if(p.Color) btn.style.backgroundColor = p.Color;
                
                btn.innerHTML = `
                    <div class="prod-name">${p.Name}</div>
                    <div class="prod-price">€${p.Price.toFixed(2)}</div>
                `;
                btn.onclick = () => sendToWinForms('productClicked', { id: p.Id, mainId: p.MainId });
                container.appendChild(btn);
            });
        }

        function renderCart(cartItems, total) {
            const container = document.getElementById('cart-list');
            container.innerHTML = '';
            document.getElementById('cart-total').innerText = `€ ${total.toFixed(2)}`;

            if (!cartItems || cartItems.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:var(--text-muted); margin-top:40px;">Winkelmand is leeg</div>`;
                return;
            }

            cartItems.forEach(item => {
                const row = document.createElement('div');
                row.className = 'cart-item';
                
                let details = '';
                if(item.Details && item.Details.length > 0) {
                    details = `<div class="cart-item-options">${item.Details.join('\n')}</div>`;
                }

                row.innerHTML = `
                    <div class="cart-item-header" onclick="sendToWinForms('editCartItem', { lineId: '${item.LineId}' })">
                        <div class="cart-item-title">${item.Amount}x ${item.Name}</div>
                        <div class="cart-item-price">€${item.LineTotal.toFixed(2)}</div>
                    </div>
                    ${details}
                    <div class="cart-controls">
                        <button class="ctrl-btn" onclick="sendToWinForms('decreaseQty', { lineId: '${item.LineId}' })">-</button>
                        <button class="ctrl-btn" onclick="sendToWinForms('increaseQty', { lineId: '${item.LineId}' })">+</button>
                        <button class="ctrl-btn btn-delete" onclick="sendToWinForms('deleteItem', { lineId: '${item.LineId}' })">✕</button>
                    </div>
                `;
                container.appendChild(row);
            });
            container.scrollTop = container.scrollHeight;
        }

        function renderActionButtons(state) {
            const container = document.getElementById('action-buttons');
            container.innerHTML = '';

            if (state === 10 || state === 11) {
                container.innerHTML = `
                    <button class="action-btn btn-table" onclick="sendToWinForms('updateOrder')">Inchecken (F11)</button>
                    <button class="action-btn btn-pay" style="grid-column: 2; height: 56px;" onclick="sendToWinForms('closeOrder')">Uitchecken (F12)</button>
                `;
            } else {
                container.innerHTML = `
                    <button class="action-btn btn-table" onclick="sendToWinForms('checkoutType', { type: 'table' })">Tafel (F6)</button>
                    <button class="action-btn btn-takeaway" onclick="sendToWinForms('checkoutType', { type: 'takeaway' })">Afhaal (F7)</button>
                    <button class="action-btn btn-delivery" onclick="sendToWinForms('checkoutType', { type: 'delivery' })">Bezorging (F8)</button>
                    <button class="action-btn btn-discount" onclick="sendToWinForms('addPromo')">Korting</button>
                    <button class="action-btn btn-pay" onclick="sendToWinForms('payOnline')">Online Betalen</button>
                `;
            }
        }

        window.addEventListener('DOMContentLoaded', () => { setTimeout(() => { sendToWinForms('ready'); }, 200); });
    </script>
</body>
</html>
